---
site_name: HTAN Phase 2 Data Model
site_description: HTAN Phase 2 Data Model Documentation
site_author: HTAN Consortium
site_url: https://htan2-data-model.readthedocs.io/

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
  extra_css:
    - assets/extra.css

plugins:
  - search

nav:
  - Home: index.md
  - Modules:
    - Clinical: generated/clinical/index.md
    - Biospecimen: generated/biospecimen/index.md
    - Core File: generated/corefile/index.md
    - Sequencing: generated/sequencing/index.md
    - WES: generated/wes/index.md
    - scRNA-seq: generated/scrna-seq/index.md
    - Imaging: generated/imaging/index.md
    - Digital Pathology: generated/digitalpathology/index.md
    - Multiplex Microscopy: generated/multiplexmicroscopy/index.md
    - Spatial Omics: generated/spatialomics/index.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
