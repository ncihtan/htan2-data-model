name: Generate Python Classes

on:
  push:
    branches: [ main ]
    paths:
      - 'modules/*/domains/*.yaml'
      - 'modules/*/src/**/*.py'
      - 'modules/*/Makefile'
      - 'Makefile'
      - 'config/config.yaml'
  pull_request:
    branches: [ main ]
    paths:
      - 'modules/*/domains/*.yaml'
      - 'modules/*/src/**/*.py'
      - 'modules/*/Makefile'
      - 'Makefile'
      - 'config/config.yaml'
      - '.github/workflows/generate-python-classes.yml'
  workflow_dispatch:

jobs:
  generate-python-classes:
    runs-on: ubuntu-latest
    
    # Grant permissions to write contents (for auto-committing to PR branches)
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0  # Required for pushing to PR branches
        # actions/checkout@v4 automatically checks out PR branch for PR events
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
    
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root
    
    - name: Install project
      run: poetry install --no-interaction
    
    - name: Generate Python Classes (using Makefile)
      run: make modules-gen
    
    - name: Run Tests
      run: |
        poetry run pytest modules/*/tests/ -v --tb=short
    
    - name: Check for Changes
      id: check-changes
      run: |
        if git diff --quiet; then
          echo "✅ No changes detected - Python classes are up to date"
          echo "has-changes=false" >> $GITHUB_OUTPUT
        else
          echo "❌ Changes detected in generated Python classes"
          echo "has-changes=true" >> $GITHUB_OUTPUT
          echo "📋 Changed files:"
          git diff --name-only
        fi
    
    - name: Auto-commit generated classes to PR branch
      if: steps.check-changes.outputs.has-changes == 'true' && github.event_name == 'pull_request'
      run: |
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Get the PR branch name
        PR_BRANCH="${{ github.event.pull_request.head.ref }}"
        PR_REPO="${{ github.event.pull_request.head.repo.full_name }}"
        
        # Check if this is a same-repo PR (GITHUB_TOKEN can push) or fork PR (needs PAT/GitHub App)
        if [ "$PR_REPO" != "${{ github.repository }}" ]; then
          echo "⚠️ This is a fork PR. Auto-commit requires a GitHub App or PAT token."
          echo "Please run 'make modules-gen' locally and push the changes."
          exit 0
        fi
        
        # Add generated Python classes
        git add modules/*/src/htan_*/datamodel/*.py || true
        
        # Commit changes (skip if no changes or commit already exists)
        git commit -m "chore: auto-generate Python classes from schema changes

        Auto-generated Python classes from LinkML schema updates.
        
        **Auto-generated by GitHub Actions workflow**
        [skip ci]" || echo "No changes to commit or commit already exists"
        
        # Push to PR branch (GITHUB_TOKEN works for same-repo PRs)
        git push origin "HEAD:$PR_BRANCH" || echo "Push failed"
    
    - name: Fail if Python classes are outdated (push to main only)
      if: steps.check-changes.outputs.has-changes == 'true' && github.event_name == 'push'
      run: |
        echo "❌ **DEPLOYMENT CHECK FAILED**"
        echo ""
        echo "The Python classes are not up to date with the current schemas."
        echo "This means the generated Python code doesn't match the LinkML YAML files."
        echo ""
        echo "**To fix this:**"
        echo "1. Run the manual Python generation workflow"
        echo "2. Or run locally: \`make modules-gen\`"
        echo "3. Commit the updated Python classes"
        echo ""
        echo "**Changed files:**"
        git diff --name-only
        exit 1
    
    - name: Create Pull Request (Push to main only)
      if: steps.check-changes.outputs.has-changes == 'true' && github.event_name == 'push'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Create a new branch for this update
        branch_name="update-python-classes-$(date +%Y%m%d-%H%M%S)"
        git checkout -b "$branch_name"
        
        # Add all changes
        git add modules/*/src/htan_*/datamodel/*.py
        
        # Commit changes
        git commit -m "feat: update Python classes from schema changes

        Auto-generated Python classes from LinkML schema updates.
        
        ### Updated Modules:
        - Biospecimen: Generated from domains/biospecimen.yaml
        - Clinical: Generated from domains/clinical.yaml  
        - WES: Generated from domains/level_1.yaml
        
        ### Changes:
        - Updated datamodel classes
        - Regenerated schema_classes.py files
        - All tests passing
        
        **Auto-generated by Python class generation workflow**"
        
        # Push branch
        git push origin "$branch_name"
        
        # Create pull request
        gh pr create \
          --title "Update Python Classes from Schema Changes" \
          --body "## Python Class Generation Update

          This PR updates the Python data model classes based on recent schema changes.

          ### Generated Classes:
          - **Biospecimen**: Updated from \`domains/biospecimen.yaml\`
          - **Clinical**: Updated from \`domains/clinical.yaml\`
          - **WES**: Updated from \`domains/level_1.yaml\`

          ### What Changed:
          - Regenerated all Python datamodel classes
          - Updated schema_classes.py files
          - All tests are passing ✅

          ### Testing:
          - All module tests pass
          - Generated classes are syntactically valid
          - Schema compatibility maintained

          **Auto-generated by GitHub Actions workflow**" \
          --base main \
          --head "$branch_name"
    
    - name: Comment on PR with Status
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "${{ steps.check-changes.outputs.has-changes }}" == "true" ]; then
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "✅ **Python classes auto-updated!**

            The Python classes have been automatically regenerated and committed to this PR branch.

            **Updated files:**
            \`\`\`
            $(git diff --name-only HEAD~1 || git diff --name-only)
            \`\`\`

            The generated classes are now up to date with the schema changes."
        else
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "✅ **Python classes are up to date!**

            All Python classes match the current schemas. No updates needed."
        fi
