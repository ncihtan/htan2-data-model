version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - pip install -r requirements.txt
    - rm -rf _build _readthedocs
    - python -m sphinx -b html -d "${READTHEDOCS_OUTPUT}/.doctrees" . "${READTHEDOCS_OUTPUT}/html"

python:
  install:
    - requirements: requirements.txt
