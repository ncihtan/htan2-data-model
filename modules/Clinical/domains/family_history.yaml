name: ClinicalFamilyHistory
id: https://w3id.org/htan/clinical/family_history
description: HTAN Clinical Data Model - Family History Domain

enums:
  YesNoUnknownNotReportedEnum:
    title: yes_no_unknown_not_reported
    permissible_values:
      "No":
        description: No
      "Yes":
        description: Yes
      "Not Reported":
        description: Not provided or available
      "Unknown":
        description: Not known, not observed, not recorded, or refused

  FamilyMemberCancerHistoryEnum:
    title: family_member_cancer_history
    permissible_values:
      "No":
        description: The non-affirmative response to a question.
      "Not Reported":
        description: Not provided or available.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.
      "Yes":
        description: The affirmative response to a question.

classes:
  FamilyHistory:
    is_a: ClinicalRecordAttributes
    description: >-
      A class to capture information about the cancer history of family members.
    attributes:
      FAMILY_MEMBER_CANCER_HISTORY:
        description: Response to indicate if any relative has a medical history that includes cancer. (caDSR:13309936) (No CRDC Standard Available)
        range: FamilyMemberCancerHistoryEnum
        required: true
        title: "Family Member Cancer History"
        slot_uri: caDSR:13309936
      RELATIVES_WITH_CANCER_HISTORY:
        description: Number of relatives the individual has with a known history of cancer. Use -1 if this data point is not available. (caDSR:15907364) (No CRDC Standard Available)
        range: integer
        required: false
        title: "Relatives with Cancer History Count"
        slot_uri: caDSR:15907364
    rules:
      - preconditions:
          slot_conditions:
            FAMILY_MEMBER_CANCER_HISTORY:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            RELATIVES_WITH_CANCER_HISTORY:
              required: true
        description: >-
          If FAMILY_MEMBER_CANCER_HISTORY is "Yes", then RELATIVES_WITH_CANCER_HISTORY becomes required 