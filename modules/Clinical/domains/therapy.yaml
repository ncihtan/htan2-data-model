name: ClinicalTherapy
id: https://w3id.org/htan/clinical/therapy
description: HTAN Clinical Data Model - Therapy Domain
imports:
  - uberon_tissues
  - ncit_antineoplastic_agent

classes:
  Therapy:
    description: Information about therapeutic interventions
    attributes:
      INITIAL_DISEASE_STATUS:
        range: InitialDiseaseStatusEnum
        required: true
        title: "Initial Disease Status"
        description: Status of the individual's malignancy when the treatment began. (caDSR:15907348) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:15907348
      TREATMENT_INTENT_TYPE:
        range: TreatmentIntentTypeEnum
        required: true
        title: "Treatment Intent Type"
        description: Anticipated outcome for therapy. (caDSR:15157467) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:15157467
      TREATMENT_TYPE:
        range: TreatmentTypeEnum
        required: true
        multivalued: true
        pattern: "^[^|]+(\\|[^|]+)*$"
        title: "Treatment Type"
        description: Type of treatment administered. (caDSR:14737565) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:14737565
      PHARMACOTHERAPY_TYPE:
        range: PharmacotherapyTypeEnum
        required: true
        title: "Pharmacotherapy Type"
        description: Whether single or combination pharmacotherapy was used. (caDSR:15743233) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:15743233
      THERAPEUTIC_AGENTS:
        range: AntineoplasticAgentEnum
        required: true
        multivalued: true
        pattern: "^[^|]+(\\|[^|]+)*$"
        title: "Therapeutic Agents"
        description: The NCit Preferred Name(s) of the Therapeutic agent(s), as dervied from https://evs.nci.nih.gov/ftp1/NCI_Thesaurus/Drug_or_Substance/Antineoplastic_Agent.xls (caDSR:14913015) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:14913015
      THERAPY_ANATOMIC_SITE_UBERON_CODE:
        range: tissue_or_organ_of_origin_uberon_enum
        required: false
        title: "Therapy Anatomic Site UBERON Code"
        description: UBERON identifier for the location within the body targeted by a therapeutic procedure, e.g. UBERON:0000002. (caDSR:14461856) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:14461856
      AGE_IN_DAYS_AT_TREATMENT_START:
        range: integer
        required: true
        title: "Age in Days at Treatment Start"
        description: The age in days of the subject at the time that this treatment was started. Use -1 if this data point is not available. (caDSR:12304720) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:12304720
      AGE_IN_DAYS_AT_TREATMENT_END:
        range: integer
        required: true
        title: "Age in Days at Treatment End"
        description: The age in days of the subject at the time that this treatment was completed. Use -1 if this data point is not available. (caDSR:12304723) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:12304723
      OFF_TREATMENT_REASON:
        range: OffTreatmentReasonEnum
        required: true
        title: "Off Treatment Reason"
        description: Reason that an individual did not receive treatment. (caDSR:15743249) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:15743249
      REGIMEN_OR_LINE_OF_THERAPY:
        range: RegimenOrLineOfTherapyEnum
        required: true
        title: "Regimen or Line of Therapy"
        description: Description of the treatment regimen or line of therapy. (caDSR:15915841) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:15915841
      NUMBER_OF_CYCLES:
        range: integer
        required: true
        title: "Number of Cycles"
        description: Number of cycles of the administered therapeutic procedure. Use -1 if this data point is not available. (caDSR:3060718) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:3060718
      RESPONSE:
        range: DiseaseResponseEnum
        required: true
        title: "Response"
        description: The result of an evaluation to determine whether pathologic and/or clinical changes resulted from treatment. (caDSR:13383448) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:13383448
    slot_usage:
      THERAPY_ANATOMIC_SITE_UBERON_CODE:
        required: false
        description: Required when TREATMENT_TYPE is a surgical or radiation therapy
      OFF_TREATMENT_REASON:
        required: false
        description: Required when AGE_IN_DAYS_AT_TREATMENT_END is present
      REGIMEN_OR_LINE_OF_THERAPY:
        required: false
        description: Required when TREATMENT_TYPE is pharmacotherapy
      NUMBER_OF_CYCLES:
        required: false
        description: Required when TREATMENT_TYPE is pharmacotherapy
      RESPONSE:
        required: false
        description: Required when AGE_IN_DAYS_AT_TREATMENT_END is present
    rules:
      - description: "When treatment type is surgical or radiation therapy, anatomic site becomes required"
        preconditions:
          slot_conditions:
            TREATMENT_TYPE:
              any_of:
                - pattern: ".*Surgical.*"
                - pattern: ".*Radiation.*"
        postconditions:
          slot_conditions:
            THERAPY_ANATOMIC_SITE_UBERON_CODE:
              required: true
      - description: "When treatment end date is present, off-treatment reason and response become required"
        preconditions:
          slot_conditions:
            AGE_IN_DAYS_AT_TREATMENT_END:
              required: true
        postconditions:
          slot_conditions:
            OFF_TREATMENT_REASON:
              required: true
            RESPONSE:
              required: true
      - description: "When treatment type is pharmacotherapy, regimen and cycles become required"
        preconditions:
          slot_conditions:
            TREATMENT_TYPE:
              equals_string: "Pharmacotherapy"
        postconditions:
          slot_conditions:
            REGIMEN_OR_LINE_OF_THERAPY:
              required: true
            NUMBER_OF_CYCLES:
              required: true 