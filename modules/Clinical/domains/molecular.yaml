name: ClinicalMolecular
id: https://w3id.org/htan/clinical/molecular
description: HTAN Clinical Data Model - Molecular Domain
imports:
  - gene_symbols

enums:
  MolecularAnalysisMethodEnum:
    title: molecular_analysis_method
    permissible_values:
      "Comparative genomic hybridization":
        description: Comparative genomic hybridization (CGH) is a technique that allows the detection of losses and gains in DNA copy number across the entire genome without prior knowledge of specific chromosomal abnormalities. Comparative genomic hybridization utilizes the hybridization of differentially labeled tumor and reference DNA to generate a map of DNA copy number changes in tumor genomes. Comparative genomic hybridization is an ideal tool for analyzing chromosomal imbalances in archived tumor material and for examining possible correlations between these findings and tumor phenotypes. (from Ried et al. J Mol Med 1997 75:801-14)
      "Cytogenetics, NOS":
        description: "Not characterized in any other way.: Techniques for analysis of chromosomal and subchromosomal properties and structures, such as those to diagnose, classify, screen for, or manage genetic diseases and abnormalities."
      "FISH":
        description: A physical mapping approach that uses fluorescent tags to detect hybridization of probes within metaphase chromosomes or less condensed somatic interphase chromatin. This technique can be used for identification of chromosomal abnormalities and for gene mapping.
      "Flow cytometry":
        description: A technique for counting, examining and sorting microscopic particles suspended in a stream of fluid.
      "IHC":
        description: Immunohistochemical staining techniques allow for the visualization of antigens via the sequential application of a specific antibody to the antigen (primary antibody), a secondary antibody to the primary antibody and an enzyme complex with a chromogenic substrate. The enzymatic activation of the chromogen results in a visible reaction product at the antigen site. The specimen may then be counterstained and coverslipped. Results are interpreted using a light microscope and aid in the differential diagnosis of pathophysiological processes, which may or may not be associated with a particular antigen.
      "ISH":
        description: In Situ Hybridization staining is an immunohistochemistry staining procedure which allows the demonstration of specific nucleic acid sequences (genes) in their cellular environment. The DNA sequence in the host cell is detected by hybridization with a biotin-labeled cDNA probe. Used for detecting protein and gene expression, determining tissue specificity, and localizing genes and proteins within tissue samples.
      "Immunofluorescence":
        description: A microscopy staining method that utilizes immunofluorescent markers for use with histological applications of preserved cells.
      "Karyotype":
        description: The preparation, analysis, and interpretation of a karyotype, the representation of the chromosome set of a cell.
      "Microarray":
        description: Analysis using microarray technology (e.g., cDNA arrays to see gene expression or protein microarrays to profile the pattern of proteins).
      "Microsatellite analysis":
        description: Analysis that looks for differences in the lengths of microsatellite repeats between alleles. Polymorphic microsatellites are present in the genome every few thousand base pairs and can function as molecular markers.
      "Not Reported":
        description: Not provided or available.
      "Nuclear staining":
        description: "Pertaining to the nucleus.: Any of the various methods that use a dye, reagent, or other material for producing coloration in tissues or microorganisms for microscopic examination."
      "Other":
        description: Different than the one(s) previously specified or mentioned.
      "PCR":
        description: A method for amplifying a DNA base sequence using multiple rounds of heat denaturation of the DNA and annealing of oligonucleotide primers complementary to flanking regions in the presence of a heat-stable polymerase. This results in duplication of the targeted DNA region. Newly synthesized DNA strands can subsequently serve as additional templates for the same primer sequences, so that successive rounds of primer annealing, strand elongation, and dissociation produce rapid and highly specific amplification of the desired sequence. PCR also can be used to detect the existence of the defined sequence in a DNA sample.
      "RNA sequencing":
        description: "Single-stranded long chain of nucleotides containing ribose. It is the end product of DNA transcription by the enzyme RNA polymerase. It is essential in protein synthesis.: The process of determining the sequence of purines and pyrimidines in nucleic acids and polynucleotides."
      "RT-PCR":
        description: RT-PCR is short for reverse transcriptase-polymerase chain reaction. It is a technique in which an RNA strand is first transcribed into a DNA complement and then subjected to PCR amplification. Transcribing an RNA strand into a DNA complement is termed reverse transcription and is done by the enzyme reverse transcriptase. (from Wikipedia)
      "Sequencing, NOS":
        description: "Not characterized in any other way.: The process of determining the sequence of purines and pyrimidines in nucleic acids and polynucleotides."
      "Southern blotting":
        description: A technique for the detection of specific DNA fragments that have been separated by polyacrylamide-gel electrophoresis, transferred to a nitrocellulose or other type of paper or nylon membrane, and detected by hybridization and visualization with a labeled probe.
      "Targeted sequencing":
        description: "The process of directing an agent to a specific anatomic location.: The process of determining the sequence of purines and pyrimidines in nucleic acids and polynucleotides."
      "Unknown":
        description: Not known, not observed, not recorded, or refused.
      "WGS":
        description: A procedure that can determine the DNA sequence for nearly the entire genome of an individual.
      "WXS":
        description: A procedure that can determine the DNA sequence for all of the exons in an individual.

  MolecularAnalysisResultEnum:
    title: molecular_analysis_result
    permissible_values:
      "Abnormal, NOS":
        description: "Not characterized in any other way.: Deviating from the norm."
      "Copy Number Reported":
        description: The number of molecules of a particular type on or in a cell or part of a cell. Usually applied to specific genes or to plasmids within a bacterium.
      "Equivocal":
        description: Open to question.
      "High":
        description: An elevated level or position or degree; greater than normal in degree or intensity or amount.
      "Intermediate":
        description: Lying between two extremes in time or space or degree.
      "Loss of Expression":
        description: An indication that expression of a gene, RNA species or protein is not detected in a sample.
      "Low":
        description: A minimum level or position or degree; less than normal in degree, intensity or amount.
      "Negative":
        description: A finding of normality following an examination or investigation looking for the presence of a microorganism, disease, or condition.
      "Normal":
        description: Being approximately average or within certain limits; conforming with or constituting a norm or standard or level or type or social norm.
      "Not Reported":
        description: Not provided or available.
      "Overexpressed":
        description: Synthesis of excess polypeptide within the cell. Overexpression is often due to the amplification or deregulation of the gene which encodes the gene product.
      "Positive":
        description: A finding of abnormality following an examination or observation confirming something, such as the presence of a disease, condition, or microorganism.
      "Test Value Reported":
        description: An indication as to whether a test value has been reported or recorded.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.

  ClinicalBiospecimenTypeEnum:
    title: clinical_biospecimen_type
    permissible_values:
      "BLOOD":
        description: A liquid tissue; its major function is to transport oxygen throughout the body. It also supplies the tissues with nutrients, removes waste products, and contains various components of the immune system defending the body against infection. Several hormones also travel in the blood.
      "BONE MARROW":
        description: The tissue occupying the spaces of bone. It consists of blood vessel sinuses and a network of hematopoietic cells which give rise to the red cells, white cells, and megakaryocytes.
      "BUCCAL CELL SAMPLE":
        description: "The mucosal membranes located on the inside of the cheek, in the buccal cavity.: The smallest units of living structure capable of independent existence, composed of a membrane-enclosed mass of protoplasm and containing a nucleus or nucleoid.: Any material sample taken from a biological entity for testing, diagnostic, propagation, treatment or research purposes, including a sample obtained from a living organism or taken from the biological object after halting of all its life functions. Biospecimen can contain one or more components including but not limited to cellular molecules, cells, tissues, organs, body fluids, embryos, and body excretory products."
      "CEREBROSPINAL FLUID":
        description: The fluid that is contained within the brain ventricles, the subarachnoid space and the central canal of the spinal cord.
      "FORMALIN FIXED PARAFFIN EMBEDDED TISSUE":
        description: "Refers to a process where a sample is preserved with formalin and then embedded into a paraffin block for sectioning.: An anatomical structure consisting of similarly specialized cells and intercellular matrix, aggregated according to genetically determined spatial relationships, performing a specific function."
      "FORMALIN FIXED TISSUE":
        description: A colorless poisonous gas synthesized by the oxidation of methanol and used as an antiseptic, disinfectant, histologic fixative, and general-purpose chemical reagent for laboratory applications. Formaldehyde is readily soluble in water and is commonly distributed as a 37% solution in water; formalin, a 10% solution of formaldehyde in water, is used as a disinfectant and to preserve biological specimens. Environmentally, formaldehyde may be found in the atmosphere, smoke from fires, automobile exhaust and cigarette smoke. Small amounts are produced during normal metabolic processes in most organisms, including humans._Tissue which is preserved in a fixative solution, usually formalin.
      "FRESH TISSUE":
        description: Tissue that is not frozen or embedded in preservatives
      "FROZEN TISSUE":
        description: A specimen that has been subjected to and immobilized by severe cold.
      "OTHER BODILY FLUIDS":
        description: "Different than the one(s) previously specified or mentioned.: Material produced by living organisms; it can be a necessary constituent of, or product of an organismal process."
      "SALIVA":
        description: The watery fluid in the mouth made by the salivary glands. Saliva moistens food to help digestion and it helps protect the mouth against infections.
      "STOOL":
        description: The material discharged from the bowel during defecation. It consists of undigested food, intestinal mucus, epithelial cells, and bacteria.
      "URINE":
        description: The fluid that is excreted by the kidneys. It is stored in the bladder and discharged through the urethra.

  MolecularConsequenceEnum:
    title: molecular_consequence
    permissible_values:
      "Frameshift":
        description: A type of mutation in which one or more paired nucleotides are inserted or deleted in the coding region of a gene, which causes the triplet codons to be read in the wrong frame; the resulting polypeptide has a garbled amino acid sequence from the mutated codon on.
      "Missense":
        description: A mutation in which a base change results in substitution of one amino acid for another. This change may result in alteration of the protein's activity or stability.
      "Monosomy":
        description: The condition in which one chromosome of a pair is missing. In a normally diploid cell it is represented symbolically as 2N-1.
      "None (inframe)":
        description: Any mutation that does not cause a change in reading frame.
      "Nullisomy":
        description: A chromosomal abnormality consisting of the absence of both copies of a pair of homologous chromosomes.
      "Splice Acceptor":
        description: A heritable single nucleotide polymorphism located at the acceptor splice site in certain allelic variants of eukaryotic genes. These sites are located in genes at intron to exon junctions at the 3' end of the intron.
      "Splice Donor":
        description: An inherited single base change at a donor splice site in a genomic DNA sequence that results in an allelic variant of the wild-type gene. Donor splice sites are located at exon to intron junctions at the 5' end of the intron.
      "Start Lost":
        description: A mutation occurring within the start codon of a gene that results in a sequence that no longer encodes a start codon. This can result in a gene deletion or gene transcription may start from an alternative start site.
      "Stop Gained":
        description: A mutation in which a base change creates a stop codon, resulting in premature termination of a polypeptide product.
      "Stop Lost":
        description: A mutation occurring within the stop codon of a gene that results in a sequence that no longer encodes a stop codon and results in the transcription of non-coding regions downstream of the gene.
      "Synonymous":
        description: A mutation that alters the DNA sequence, but encodes the same amino acid.
      "Trisomy":
        description: A chromosomal abnormality consisting of the presence of one chromosome in addition to the normal diploid number.

  PathogenicityEnum:
    title: pathogenicity
    permissible_values:
      "Benign":
        description: A genetic variant that is known to not contribute to the development of a disease.
      "Likely Benign":
        description: A genetic variant that is not expected to contribute to the development of a disease, but the scientific evidence may be insufficient to prove this conclusively.
      "Likely Pathogenic":
        description: An ad hoc category that describes genetic variants with 90% or greater certainty of contributing to the development of a disease.
      "Not Reported":
        description: Not provided or available.
      "Pathogenic":
        description: A genetic variant that is known to directly contribute to the development of disease.
      "Uncertain Significance":
        description: An indication that there is not enough information to support a more definitive classification of the pathogenicity of a genetic variant.
      "Unknown":
        description: Not known, observed, recorded; or reported as unknown by the data contributor.

  TestAnalyteTypeEnum:
    title: test_analyte_type
    permissible_values:
      "DNA":
        description: A long linear double-stranded polymer formed from nucleotides attached to a deoxyribose backbone and found in the nucleus of a cell; associated with the transmission of genetic information.
      "Not Reported":
        description: Not provided or available.
      "Nucleic RNA":
        description: A biological specimen comprised of the RNA isolated from the nuclei of cells.
      "Protein":
        description: Any of a group of complex organic macromolecules that contain carbon, hydrogen, oxygen, nitrogen, and usually sulfur and are composed of one or more chains of amino acids. Proteins are fundamental components of all living cells and include many substances, such as enzymes, hormones, and antibodies, that are necessary for the proper functioning of an organism.
      "RNA":
        description: A biospecimen created to contain an isolated or enriched RNA sample.
      "Total RNA":
        description: A biological sample comprised of all of the RNA collected from an experimental subject.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.
      "cfDNA":
        description: DNA found in blood plasma and other bodily fluids that is not associated with cells.
      "ctDNA":
        description: Neoplasm-derived DNA found in blood plasma and other bodily fluids that is not associated with cells.
      "mRNA":
        description: A class of RNA molecule containing protein-coding information in its nucleotide sequence that can be translated into the amino acid sequence of a protein.
      "miRNA":
        description: A sequence of single-stranded RNA, that is 20-25 nucleotides in length, which is transcribed from DNA but is not translated into a protein. This nucleic acid may regulate the transcription or translation of other genes.

