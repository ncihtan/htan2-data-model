name: ClinicalMolecular
id: https://w3id.org/htan/clinical/molecular
description: HTAN Clinical Data Model - Molecular Domain
imports:
  - gene_symbols

enums:
  MolecularAnalysisMethodEnum:
    title: molecular_analysis_method
    permissible_values:
      "Comparative genomic hybridization":
        description: Comparative genomic hybridization (CGH) is a technique that allows the detection of losses and gains in DNA copy number across the entire genome without prior knowledge of specific chromosomal abnormalities. Comparative genomic hybridization utilizes the hybridization of differentially labeled tumor and reference DNA to generate a map of DNA copy number changes in tumor genomes. Comparative genomic hybridization is an ideal tool for analyzing chromosomal imbalances in archived tumor material and for examining possible correlations between these findings and tumor phenotypes. (from Ried et al. J Mol Med 1997 75:801-14)
      "Cytogenetics, NOS":
        description: Not characterized in any other way.: Techniques for analysis of chromosomal and subchromosomal properties and structures, such as those to diagnose, classify, screen for, or manage genetic diseases and abnormalities.
      "FISH":
        description: A physical mapping approach that uses fluorescent tags to detect hybridization of probes within metaphase chromosomes or less condensed somatic interphase chromatin. This technique can be used for identification of chromosomal abnormalities and for gene mapping.
      "Flow cytometry":
        description: A technique for counting, examining and sorting microscopic particles suspended in a stream of fluid.
      "IHC":
        description: Immunohistochemical staining techniques allow for the visualization of antigens via the sequential application of a specific antibody to the antigen (primary antibody), a secondary antibody to the primary antibody and an enzyme complex with a chromogenic substrate. The enzymatic activation of the chromogen results in a visible reaction product at the antigen site. The specimen may then be counterstained and coverslipped. Results are interpreted using a light microscope and aid in the differential diagnosis of pathophysiological processes, which may or may not be associated with a particular antigen.
      "ISH":
        description: In Situ Hybridization staining is an immunohistochemistry staining procedure which allows the demonstration of specific nucleic acid sequences (genes) in their cellular environment. The DNA sequence in the host cell is detected by hybridization with a biotin-labeled cDNA probe. Used for detecting protein and gene expression, determining tissue specificity, and localizing genes and proteins within tissue samples.
      "Immunofluorescence":
        description: A microscopy staining method that utilizes immunofluorescent markers for use with histological applications of preserved cells.
      "Karyotype":
        description: The preparation, analysis, and interpretation of a karyotype, the representation of the chromosome set of a cell.
      "Microarray":
        description: Analysis using microarray technology (e.g., cDNA arrays to see gene expression or protein microarrays to profile the pattern of proteins).
      "Microsatellite analysis":
        description: Analysis that looks for differences in the lengths of microsatellite repeats between alleles. Polymorphic microsatellites are present in the genome every few thousand base pairs and can function as molecular markers.
      "Not Reported":
        description: Not provided or available.
      "Nuclear staining":
        description: Pertaining to the nucleus.: Any of the various methods that use a dye, reagent, or other material for producing coloration in tissues or microorganisms for microscopic examination.
      "Other":
        description: Different than the one(s) previously specified or mentioned.
      "PCR":
        description: A method for amplifying a DNA base sequence using multiple rounds of heat denaturation of the DNA and annealing of oligonucleotide primers complementary to flanking regions in the presence of a heat-stable polymerase. This results in duplication of the targeted DNA region. Newly synthesized DNA strands can subsequently serve as additional templates for the same primer sequences, so that successive rounds of primer annealing, strand elongation, and dissociation produce rapid and highly specific amplification of the desired sequence. PCR also can be used to detect the existence of the defined sequence in a DNA sample.
      "RNA sequencing":
        description: Single-stranded long chain of nucleotides containing ribose. It is the end product of DNA transcription by the enzyme RNA polymerase. It is essential in protein synthesis.: The process of determining the sequence of purines and pyrimidines in nucleic acids and polynucleotides.
      "RT-PCR":
        description: RT-PCR is short for reverse transcriptase-polymerase chain reaction. It is a technique in which an RNA strand is first transcribed into a DNA complement and then subjected to PCR amplification. Transcribing an RNA strand into a DNA complement is termed reverse transcription and is done by the enzyme reverse transcriptase. (from Wikipedia)
      "Sequencing, NOS":
        description: Not characterized in any other way.: The process of determining the sequence of purines and pyrimidines in nucleic acids and polynucleotides.
      "Southern blotting":
        description: A technique for the detection of specific DNA fragments that have been separated by polyacrylamide-gel electrophoresis, transferred to a nitrocellulose or other type of paper or nylon membrane, and detected by hybridization and visualization with a labeled probe.
      "Targeted sequencing":
        description: The process of directing an agent to a specific anatomic location.: The process of determining the sequence of purines and pyrimidines in nucleic acids and polynucleotides.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.
      "WGS":
        description: A procedure that can determine the DNA sequence for nearly the entire genome of an individual.
      "WXS":
        description: A procedure that can determine the DNA sequence for all of the exons in an individual.

  MolecularAnalysisResultEnum:
    title: molecular_analysis_result
    permissible_values:
      "Abnormal, NOS":
        description: Not characterized in any other way.: Deviating from the norm.
      "Copy Number Reported":
        description: The number of molecules of a particular type on or in a cell or part of a cell. Usually applied to specific genes or to plasmids within a bacterium.
      "Equivocal":
        description: Open to question.
      "High":
        description: An elevated level or position or degree; greater than normal in degree or intensity or amount.
      "Intermediate":
        description: Lying between two extremes in time or space or degree.
      "Loss of Expression":
        description: An indication that expression of a gene, RNA species or protein is not detected in a sample.
      "Low":
        description: A minimum level or position or degree; less than normal in degree, intensity or amount.
      "Negative":
        description: A finding of normality following an examination or investigation looking for the presence of a microorganism, disease, or condition.
      "Normal":
        description: Being approximately average or within certain limits; conforming with or constituting a norm or standard or level or type or social norm.
      "Not Reported":
        description: Not provided or available.
      "Overexpressed":
        description: Synthesis of excess polypeptide within the cell. Overexpression is often due to the amplification or deregulation of the gene which encodes the gene product.
      "Positive":
        description: A finding of abnormality following an examination or observation confirming something, such as the presence of a disease, condition, or microorganism.
      "Test Value Reported":
        description: An indication as to whether a test value has been reported or recorded.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.

  ClinicalBiospecimenTypeEnum:
    title: clinical_biospecimen_type
    permissible_values:
      "Blood":
        description: Blood
      "Tissue":
        description: Tissue
      "Not Reported":
        description: Not provided or available
      "Unknown":
        description: Not known, not observed, not recorded, or refused

  MolecularConsequenceEnum:
    title: molecular_consequence
    permissible_values:
      "Frameshift":
        description: Frameshift mutation
      "Missense":
        description: Missense mutation
      "Nonsense":
        description: Nonsense mutation
      "Not Reported":
        description: Not provided or available
      "Unknown":
        description: Not known, not observed, not recorded, or refused

  PathogenicityEnum:
    title: pathogenicity
    permissible_values:
      "Benign":
        description: Benign
      "Likely Benign":
        description: Likely benign
      "Likely Pathogenic":
        description: Likely pathogenic
      "Pathogenic":
        description: Pathogenic
      "Not Reported":
        description: Not provided or available
      "Unknown":
        description: Not known, not observed, not recorded, or refused

  TestAnalyteTypeEnum:
    title: test_analyte_type
    permissible_values:
      "DNA":
        description: DNA
      "RNA":
        description: RNA
      "Protein":
        description: Protein
      "Not Reported":
        description: Not provided or available
      "Unknown":
        description: Not known, not observed, not recorded, or refused

  VariantOriginEnum:
    title: variant_origin
    permissible_values:
      "Germline":
        description: Germline variant
      "Somatic":
        description: Somatic variant
      "Not Reported":
        description: Not provided or available
      "Unknown":
        description: Not known, not observed, not recorded, or refused

  VariantTypeEnum:
    title: variant_type
    permissible_values:
      "Deletion":
        description: Deletion
      "Insertion":
        description: Insertion
      "Substitution":
        description: Substitution
      "Not Reported":
        description: Not provided or available
      "Unknown":
        description: Not known, not observed, not recorded, or refused

classes:
  MolecularTest:
    description: Information about the molecular test
    attributes:
      TIMEPOINT_LABEL:
        range: string
        required: false
        title: "Timepoint Label"
        description: Label to identify the time point at which the clinical data or biospecimen was obtained (e.g. Baseline, End of Treatment, Overall survival, Final). NO PHI/PII INFORMATION IS ALLOWED. (caDSR:8031077) (No CRDC Standard Available)
        slot_uri: caDSR:8031077
      AGE_IN_DAYS_AT_MOLECULAR_TEST_START:
        range: integer
        required: true
        title: "Age in Days at Molecular Test Start"
        description: Age in days of the subject at the start of a molecular analysis. Use -1 if this data point is not available. (caDSR:15879017) (No CRDC Standard Available)
        slot_uri: caDSR:15879017
      AGE_IN_DAYS_AT_MOLECULAR_TEST_STOP:
        range: integer
        required: false
        title: "Age in Days at Molecular Test Stop"
        description: Age in days of the subject at the end of a molecular analysis. (caDSR:15879662) (No CRDC Standard Available)
        slot_uri: caDSR:15879662
      GENE_SYMBOL:
        range: gene_symbol_enum
        required: true
        title: "Gene Symbol"
        description: Gene symbol of the gene targeted or included in molecular analysis. (caDSR:11280318) (No CRDC Standard Available)
        slot_uri: caDSR:11280318
      MOLECULAR_ANALYSIS_METHOD:
        range: MolecularAnalysisMethodEnum
        required: true
        title: "Molecular Analysis Method"
        description: Description of the method used for clinical molecular analysis. (caDSR:6142401) (No CRDC Standard Available)
        slot_uri: caDSR:6142401
      MOLECULAR_ANALYSIS_RESULT:
        range: MolecularAnalysisResultEnum
        required: true
        title: "Molecular Analysis Result"
        description: Description of the result of clinical molecular analysis. (caDSR:6142397) (No CRDC Standard Available)
        slot_uri: caDSR:6142397
      AA_CHANGE:
        range: string
        required: false
        title: "Amino Acid Change"
        description: Alphanumeric value used to describe the amino acid change for a specific genetic variant, e.g., R116Q, as determined by clinical testing. (caDSR:6142508) (No CRDC Standard Available)
        slot_uri: caDSR:6142508
      CLINICAL_BIOSPECIMEN_TYPE:
        range: ClinicalBiospecimenTypeEnum
        required: true
        title: "Clinical Biospecimen Type"
        description: Clinical biospecimen type (caDSR:2192208) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:2192208
      COPY_NUMBER:
        range: integer
        required: false
        title: "Copy Number"
        description: The quantity of gene copies resulting from a mutation. (caDSR:13367966) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:13367966
      EXON:
        range: integer
        required: false
        title: "Exon"
        description: Exon number targeted or included in a clinical molecular analysis. (caDSR:6142411) (No CRDC Standard Available)
        slot_uri: caDSR:6142411
      MOLECULAR_CONSEQUENCE:
        range: MolecularConsequenceEnum
        required: true
        title: "Molecular Consequence"
        description: Molecular consequence (caDSR:2192211) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:2192211
      PATHOGENICITY:
        range: PathogenicityEnum
        required: true
        title: "Pathogenicity"
        description: Pathogenicity (caDSR:2192212) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:2192212
      TEST_ANALYTE_TYPE:
        range: TestAnalyteTypeEnum
        required: true
        title: "Test Analyte Type"
        description: Test analyte type (caDSR:2192213) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:2192213
      TEST_UNITS:
        range: string
        required: true
        title: "Test Units"
        description: Test units (caDSR:2192214) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:2192214
      TEST_RESULT:
        range: string
        required: true
        title: "Test Result"
        description: Test result (caDSR:2192215) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:2192215
      VARIANT_ORIGIN:
        range: VariantOriginEnum
        required: true
        title: "Variant Origin"
        description: Variant origin (caDSR:2192216) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:2192216
      VARIANT_TYPE:
        range: VariantTypeEnum
        required: true
        title: "Variant Type"
        description: Variant type (caDSR:2192217) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:2192217
    slot_usage:
      AGE_IN_DAYS_AT_MOLECULAR_TEST_STOP:
        required: false
        description: Required when MOLECULAR_ANALYSIS_METHOD is DNA Sequencing or RNA Sequencing
      AA_CHANGE:
        required: false
        description: Required when MOLECULAR_ANALYSIS_RESULT is Pathogenic variant detected or Variant of uncertain significance detected
      COPY_NUMBER:
        required: false
        description: Required when MOLECULAR_ANALYSIS_RESULT is Copy number variant detected
      EXON:
        required: false
        description: Required when MOLECULAR_ANALYSIS_RESULT is Pathogenic variant detected or Variant of uncertain significance detected
      MOLECULAR_CONSEQUENCE:
        required: false
        description: Required when MOLECULAR_ANALYSIS_RESULT is Pathogenic variant detected or Variant of uncertain significance detected
      PATHOGENICITY:
        required: false
        description: Required when MOLECULAR_ANALYSIS_RESULT is Pathogenic variant detected or Variant of uncertain significance detected
      TEST_ANALYTE_TYPE:
        required: false
        description: Required when MOLECULAR_ANALYSIS_METHOD is DNA Sequencing or RNA Sequencing
      TEST_UNITS:
        required: false
        description: Required when MOLECULAR_ANALYSIS_RESULT is Copy number variant detected
    rules:
      - description: "When molecular analysis method is DNA or RNA sequencing, test stop age and analyte type become required"
        preconditions:
          slot_conditions:
            MOLECULAR_ANALYSIS_METHOD:
              any_of:
                - equals_string: "DNA Sequencing"
                - equals_string: "RNA Sequencing"
        postconditions:
          slot_conditions:
            AGE_IN_DAYS_AT_MOLECULAR_TEST_STOP:
              required: true
            TEST_ANALYTE_TYPE:
              required: true
      - description: "When molecular analysis result indicates a variant, variant details become required"
        preconditions:
          slot_conditions:
            MOLECULAR_ANALYSIS_RESULT:
              any_of:
                - equals_string: "Pathogenic variant detected"
                - equals_string: "Variant of uncertain significance detected"
        postconditions:
          slot_conditions:
            AA_CHANGE:
              required: true
            EXON:
              required: true
            MOLECULAR_CONSEQUENCE:
              required: true
            PATHOGENICITY:
              required: true
      - description: "When molecular analysis result indicates a copy number variant, copy number and units become required"
        preconditions:
          slot_conditions:
            MOLECULAR_ANALYSIS_RESULT:
              equals_string: "Copy number variant detected"
        postconditions:
          slot_conditions:
            COPY_NUMBER:
              required: true
            TEST_UNITS:
              required: true