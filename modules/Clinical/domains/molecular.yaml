        description: A measure of weight.  A milligram is approximately 450,000 times smaller than a pound and 28,000 times smaller than an ounce.
      "mg/24hr":
        description: A unit of mass flow rate equivalent to the rate at which one thousandth of a gram of matter crosses a given surface or is delivered to a given object or space over a period of time equal to twenty four hours. Milligram per twenty four hours is also a dose administration rate unit equal to the rate at which one thousandth of a gram of a product is administered per unit of time equal to twenty four hours.
