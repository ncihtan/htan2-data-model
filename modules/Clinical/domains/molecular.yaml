  VariantOriginEnum:
    title: variant_origin
    permissible_values:
      "Germline":
        description: The DNA in germ cells (egg and sperm cells that join to form an embryo). Germline DNA is the source of DNA for all other cells in the body.
      "Not Reported":
        description: Not provided or available.
      "Somatic":
        description: The genomic DNA found in the non-reproductive (non-germ) cells of an organism.
      "Somatic Mosaic":
        description: The presence of genetic mosaicism in non-germ cells.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.

  VariantTypeEnum:
    title: variant_type
    permissible_values:
      "Alleles":
        description: Mutually exclusive alternative forms of the same gene occupying the same locus on homologous chromosomes, differing in nucleotide sequence and governing the same biochemical and developmental process.
      "Amplification":
        description: An increase in the copy number of a particular gene. This type of abnormality can be either inherited or somatic.
      "Chimerism":
        description: The occurrence in an individual of two or more cell populations of different chromosomal constitutions, derived from different individuals. This contrasts with mosaicism in which the different cell populations are derived from a single individual.
      "Chromosomal Gain":
        description: A cytogenetic abnormality that refers to gain of an entire chromosome, a chromosome arm or a chromosomal band.
      "Chromosomal Loss":
        description: Loss of an entire chromosome or chromosome arm.
      "Conversion":
        description: "The act of changing the nature, form, function, or purpose of something to another.: Any transmissible change in the genetic material of an organism, which can result from radiation, viral infection, transposition, treatment with mutagenic chemicals and errors during DNA replication or meiosis. The effects of mutation range from single base changes to loss or gain of complete chromosomes. As many of the simpler alterations to DNA may be repaired, such changes are only heritable once the change is fixed in the DNA by the process of replication. Mutations may be associated with genetic diversity or with pathologies including cancer."
      "Deletion":
        description: A loss of any genetic material on a chromosome, ranging from loss of a single nucleotide, to loss of part or all of a gene, to loss of a visible portion of the chromosome involving multiple genes. Deletions often disrupt gene or protein function and cell function as a result.
      "Deletion-insertion":
        description: "Any rearrangement to the genomic content that results in the loss of one or more nucleotides of DNA. Deletions are generally irreversible rearrangements. They may alter the reading frame of a gene, or may result in loss of large chromosomal regions.: An article used to connect words, phrases, or clauses representing alternatives; used to connect alternative terms for the same thing; used in correlation; used to correct or rephrase what was previously said; otherwise.: Any rearrangement to the genomic content that adds one or more extra nucleotides into the DNA. Insertions may be reversible, particulary if caused by transposable elements. They may alter the reading frame of a gene, or may cause large scale additions of genomic DNA."
      "Duplication":
        description: Generation of an extra copy of a particular gene in the genome. A gene duplication abnormality may occur by gene amplification, random breakage and reunion, retrotransposition or unequal crossing-over at meiosis. A gene duplication abnormality can be either heritable or somatic.
      "Extension":
        description: "To increase in length or duration.: Any transmissible change in the genetic material of an organism, which can result from radiation, viral infection, transposition, treatment with mutagenic chemicals and errors during DNA replication or meiosis. The effects of mutation range from single base changes to loss or gain of complete chromosomes. As many of the simpler alterations to DNA may be repaired, such changes are only heritable once the change is fixed in the DNA by the process of replication. Mutations may be associated with genetic diversity or with pathologies including cancer."
      "Hypermethylation":
        description: Hypermethylation appears to be a controlled, epigenetic, heritable, and aberrant DNA methylation reaction on gene promoter regions and CpG islands associated with loss of (e.g., tumor-suppressor) gene function in diverse cellular pathways through transcriptional silencing by the formation of transcriptionally repressive chromatin.
      "Insertion":
        description: Mutations that result in the insertion of one or more nucleotides into a wild type DNA sequence. Can result in a frame shift in the coding sequence of a gene.
      "Inversion":
        description: A structural change in genomic DNA where the 5' to 3' order of a nucleotide sequence is completely reversed to the 3' to 5' order relative to its adjacent sequences. This inversion is termed either pericentric, if it includes the centromere of a chromosome, or pancentric, if it excludes the centromere. An inversion mutation abnormality may be heritable or occur somatically.
      "Methylation":
        description: The covalent chemical or biochemical addition of a methyl group(s) to a compound. (NCI)
      "Mosaicism":
        description: The presence of more than one genetically distinct cell line in germ and/or somatic cells.
      "Not Reported":
        description: Not provided or available.
      "Other":
        description: Different than the one(s) previously specified or mentioned.
      "Partial methylation":
        description: "Being or affecting only a part of something.: The covalent chemical or biochemical addition of a methyl group(s) to a compound. (NCI)"
      "Rearrangement":
        description: Any process affecting a DNA sequence that results in the gain, loss or exchange of DNA between chromosomes and/or autonomous replicons.
      "Repeated sequences":
        description: "Make or do or perform again.: The sequence of nucleotide residues along a DNA chain."
      "Splice":
        description: A mutation that alters or abolishes the specific sequence denoting the site at which the splicing of an intron takes place. Such mutations may result in one or more introns remaining in the mature messenger RNA or fusion of non-adjacent exons and can disrupt the generation of the protein product.
      "Substitution":
        description: "The act of putting one thing or person in the place of another.: Any transmissible change in the genetic material of an organism, which can result from radiation, viral infection, transposition, treatment with mutagenic chemicals and errors during DNA replication or meiosis. The effects of mutation range from single base changes to loss or gain of complete chromosomes. As many of the simpler alterations to DNA may be repaired, such changes are only heritable once the change is fixed in the DNA by the process of replication. Mutations may be associated with genetic diversity or with pathologies including cancer."
      "Translocation":
        description: "The movement of a physical object from one place to another. (NCI): Any transmissible change in the genetic material of an organism, which can result from radiation, viral infection, transposition, treatment with mutagenic chemicals and errors during DNA replication or meiosis. The effects of mutation range from single base changes to loss or gain of complete chromosomes. As many of the simpler alterations to DNA may be repaired, such changes are only heritable once the change is fixed in the DNA by the process of replication. Mutations may be associated with genetic diversity or with pathologies including cancer."
      "Unknown":
        description: Not known, not observed, not recorded, or refused.

classes:
  MolecularTest:
    description: Information about the molecular test
    attributes:
      TIMEPOINT_LABEL:
        range: string
        required: false
        title: "Timepoint Label"
        description: Label to identify the time point at which the clinical data or biospecimen was obtained (e.g. Baseline, End of Treatment, Overall survival, Final). NO PHI/PII INFORMATION IS ALLOWED. (caDSR:8031077) (No CRDC Standard Available)
        slot_uri: caDSR:8031077
      AGE_IN_DAYS_AT_MOLECULAR_TEST_START:
        range: integer
        required: true
        title: "Age in Days at Molecular Test Start"
        description: Age in days of the subject at the start of a molecular analysis. Use -1 if this data point is not available. (caDSR:15879017) (No CRDC Standard Available)
        slot_uri: caDSR:15879017
      AGE_IN_DAYS_AT_MOLECULAR_TEST_STOP:
        range: integer
        required: false
        title: "Age in Days at Molecular Test Stop"
        description: Age in days of the subject at the end of a molecular analysis. (caDSR:15879662) (No CRDC Standard Available)
        slot_uri: caDSR:15879662
      GENE_SYMBOL:
        range: gene_symbol_enum
        required: true
        title: "Gene Symbol"
        description: Gene symbol of the gene targeted or included in molecular analysis. (caDSR:11280318) (No CRDC Standard Available)
        slot_uri: caDSR:11280318
      MOLECULAR_ANALYSIS_METHOD:
        range: MolecularAnalysisMethodEnum
        required: true
        title: "Molecular Analysis Method"
        description: Description of the method used for clinical molecular analysis. (caDSR:6142401) (No CRDC Standard Available)
        slot_uri: caDSR:6142401
      MOLECULAR_ANALYSIS_RESULT:
        range: MolecularAnalysisResultEnum
        required: true
        title: "Molecular Analysis Result"
        description: Description of the result of clinical molecular analysis. (caDSR:6142397) (No CRDC Standard Available)
        slot_uri: caDSR:6142397
      AA_CHANGE:
        range: string
        required: false
        title: "Amino Acid Change"
        description: Alphanumeric value used to describe the amino acid change for a specific genetic variant, e.g., R116Q, as determined by clinical testing. (caDSR:6142508) (No CRDC Standard Available)
        slot_uri: caDSR:6142508
      CLINICAL_BIOSPECIMEN_TYPE:
        range: ClinicalBiospecimenTypeEnum
        required: true
        title: "Clinical Biospecimen Type"
        description: Kind of material taken from a biological entity for testing, diagnostic, propagation, treatment or research purposes. (caDSR:7069877) (Aligns to CRDC Node)
        slot_uri: caDSR:7069877
      COPY_NUMBER:
        range: integer
        required: false
        title: "Copy Number"
        description: The quantity of gene copies resulting from a mutation. (caDSR:13367966) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:13367966
      EXON:
        range: integer
        required: false
        title: "Exon"
        description: Exon number targeted or included in a clinical molecular analysis. (caDSR:6142411) (No CRDC Standard Available)
        slot_uri: caDSR:6142411
      MOLECULAR_CONSEQUENCE:
        range: MolecularConsequenceEnum
        required: false
        title: "Molecular Consequence"
        description: Description of the molecular consequence of genetic variation identified by a clinical test. (caDSR:13367935) (No CRDC Standard Available)
        slot_uri: caDSR:13367935
      PATHOGENICITY:
        range: PathogenicityEnum
        required: false
        title: "Pathogenicity"
        description: Description of a variant's level of involvement in the cause of the individual's disease according to the standards outlined by the American College of Medical Genetics and Genomics (ACMG). (caDSR:14532361) (No CRDC Standard Available)
        slot_uri: caDSR:14532361
      TEST_ANALYTE_TYPE:
        range: TestAnalyteTypeEnum
        required: false
        title: "Test Analyte Type"
        description: Sample type or material being subjected to analysis. (caDSR:15063661) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:15063661
      TEST_UNITS:
        range: TestUnitsEnum
        required: false
        title: "Test Units"
        description: Preferred unit of measure (UOM) for a laboratory test result, per NCI standards or per protocol specification. (caDSR:2195977) (No CRDC Standard Available)
        slot_uri: caDSR:2195977
      TEST_RESULT:
        range: string
        required: false
        title: "Test Result"
        description: Specific result of a clinical molecular test. Use this field only if one of the permissible values in MOLECULAR_ANALYSIS_RESULT isn't relevant. Please provide TEST_UNITS if applicable. (caDSR:2230153) (No CRDC Standard Available)
        slot_uri: caDSR:2230153
      VARIANT_ORIGIN:
        range: VariantOriginEnum
        required: false
