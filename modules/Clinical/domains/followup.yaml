name: ClinicalFollowUp
id: https://w3id.org/htan/clinical/followup
description: HTAN Clinical Data Model - FollowUp Domain
imports:
  - disease_response_enum

enums:
  ECOGPerformanceStatusEnum:
    title: ecog_performance_status
    permissible_values:
      "0":
        description: Fully active, able to carry on all pre-disease performance without restriction.
      "1":
        description: Restricted in physically strenuous activity but ambulatory and able to carry out work of a light or sedentary nature, e.g., light housework, office work.
      "2":
        description: Ambulatory and capable of all self care but unable to carry out any work activities. Up and about more than 50% of waking hours.
      "3":
        description: Capable of only limited selfcare, confined to bed or chair more than 50% of waking hours.
      "4":
        description: Completely disabled. Cannot carry on any selfcare. Totally confined to bed or chair.
      "5":
        description: Dead.

  EvidenceOfRecurrenceTypeEnum:
    title: evidence_of_recurrence_type
    permissible_values:
      "Biopsy with Histologic Confirmation":
        description: A biopsy with microscopic confirmation.
      "Convincing Image (i.e. CT/PET/MRI)":
        description: Radiologic evidence that supports a diagnosis.
      "Positive Biomarkers":
        description: A finding indicating the presence of a biomarker in a tumor sample from a patient with a malignant neoplasm.

  ProgressionOrRecurrenceEnum:
    title: progression_or_recurrence
    permissible_values:
      "Censored":
        description: Points of data for which only partial information is known.
      "No":
        description: The non-affirmative response to a question.
      "Not Allowed to Collect":
        description: An indicator that specifies that a collection event was not permitted.
      "Not Applicable":
        description: Determination of a value is not relevant in the current context.
      "Not Reported":
        description: Not provided or available.
      "Unknown":
        description: Not known, observed, recorded; or reported as unknown by the data contributor.
      "Yes":
        description: The affirmative response to a question.

  ProgressionTypeEnum:
    title: progression_type
    permissible_values:
      "Biochemical":
        description: An indication that biochemical markers of a disease are present.
      "Distant":
        description: A biological process that involves the transfer and growth of cancer cells from the site of the primary tumor. Relocation of malignant cells during metastasis can be restricted to movement within a specific tissue/organ or may entail migration to a distal locus within the body. This phenotype is a characteristic of all malignant tumors.
      "Local":
        description: A disease that is confined to a specific organ or tissue and has not spread to other anatomic sites.
      "Locoregional":
        description: A disease that occurs within a specific organ or tissue and extends into adjacent areas including lymph nodes.
      "Not Reported":
        description: Not provided or available.
      "Regional":
        description: A disease or condition that extends beyond the site and spreads into adjacent tissues and regional lymph nodes.
      "Unknown":
        description: Not known, observed, recorded; or reported as unknown by the data contributor.

  EcogAvailabilityEnum:
    title: ecog_availability
    permissible_values:
      "No":
        description: The non-affirmative response to a question.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.
      "Yes":
        description: The affirmative response to a question.

  MenopauseStatusEnum:
    title: menopause_status
    permissible_values:
      "Menopausal":
        description: The permanent cessation of menses, usually defined by 6 to 12 months of amenorrhea in a woman over 45 years of age.
      "Not Applicable":
        description: Determination of a value is not relevant in the current context.
      "Not Reported":
        description: Not provided or available.
      "Perimenopausal":
        description: The time of a woman's life when menstrual periods become irregular. Refers to the time near menopause.
      "Postmenopausal":
        description: Having to do with the time after menopause. Menopause ('change of life') is the time in a woman's life when menstrual periods stop permanently.
      "Postmenopausal (>12 mo since LMP with no prior ovariectomy)":
        description: Having to do with the time after menopause. Menopause ('change of life') is the time in a woman's life when menstrual periods stop permanently.
      "Postmenopausal (prior bilateral ovariectomy)":
        description: Having to do with the time after menopause. Menopause ('change of life') is the time in a woman's life when menstrual periods stop permanently.
      "Premenopausal":
        description: Refers to the time before menopause. Menopause is the time of life when a women's menstrual periods stop permanently; also called 'change of life.'
      "Premenopausal/Perimenopausal":
        description: "Prior to menopause. : Used to indicate that either or both of two items or options may be valid.: Describes the time in a woman's life when menstrual periods become irregular as she approaches menopause. This is usually three to five years before menopause and is often marked by many of the symptoms of menopause, including hot flashes, mood swings, night sweats, vaginal dryness, trouble concentrating, and infertility."
      "Unknown":
        description: Not known, not observed, not recorded, or refused.

classes:
  FollowUp:
    is_a: ClinicalRecordAttributes
    description: Clinical follow-up information
    attributes:
      AGE_IN_DAYS_AT_FOLLOWUP:
        range: integer
        required: true
        title: "Age in Days at Followup"
        description: Age in days of the subject at the the time of follow-up. Use -1 if this data point is not available. (caDSR:15748634) (No CRDC Standard Available)
        slot_uri: caDSR:15748634
      PROGRESSION_OR_RECURRENCE:
        range: ProgressionOrRecurrenceEnum
        required: true
        title: "Progression or Recurrence"
        description: Response indicating whether or not a subject has a progressive disease or a recurrent disease. (caDSR:13529783) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:13529783
      PROGRESSION_OR_RECURRENCE_ANATOMIC_SITE_UBERON_CODE:
        range: tissue_or_organ_of_origin_uberon_enum
        required: false
        multivalued: true
        title: "Progression or Recurrence Anatomic Site UBERON Code"
        description: UBERON identifier indicating where in the body a disease has progressed or recurred, e.g. UBERON:0000002. (caDSR:14883061) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:14883061
      PROGRESSION_OR_RECURRENCE_TYPE:
        range: ProgressionTypeEnum
        required: false
        title: "Progression or Recurrence Type"
        description: Type of worsening or reemergence of disease over time. (caDSR:14742451) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:14742451
      EVIDENCE_OF_RECURRENCE_TYPE:
        range: EvidenceOfRecurrenceTypeEnum
        required: false
        title: "Evidence of Recurrence Type"
        description: Type of evidence used to determine whether the individual's disease has recurred. (caDSR:7668166) (No CRDC Standard Available)
        slot_uri: caDSR:7668166
      AGE_IN_DAYS_AT_PROGRESSION_OR_RECURRENCE:
        range: integer
        required: false
        title: "Age in Days at Progression or Recurrence"
        description: Age of an individual, in days, when a diagnosis of disease progression or recurrence was made. Use -1 if this data point is not available. (caDSR:15748659) (No CRDC Standard Available)
        slot_uri: caDSR:15748659
      DISEASE_RESPONSE:
        range: DiseaseResponseEnum
        required: true
        title: "Disease Response"
        description: Result of an evaluation to determine whether pathologic and/or clinical changes resulted from treatment. (caDSR:13383448) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:13383448
      ECOG_PERFORMANCE_STATUS_IS_AVAILABLE:
        range: EcogAvailabilityEnum
        required: true
        title: "ECOG Performance Status Is Available"
        description: Indicator of whether ECOG performance status data is available for the individual.
      ECOG_PERFORMANCE_STATUS:
        range: ECOGPerformanceStatusEnum
        required: false
        title: "ECOG Performance Status"
        description: ECOG functional performance status of the individual. (caDSR:88) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:88
      MENOPAUSE_STATUS:
        range: MenopauseStatusEnum
        required: false
        title: "Menopause Status"
        description: Menopausal status of the individual. (caDSR:2434914) (No CRDC Standard Available)
        slot_uri: caDSR:2434914
    slot_usage:
      PROGRESSION_OR_RECURRENCE_ANATOMIC_SITE_UBERON_CODE:
        required: false
        description: Required when PROGRESSION_OR_RECURRENCE is "Yes"
      PROGRESSION_OR_RECURRENCE_TYPE:
        required: false
        description: Required when PROGRESSION_OR_RECURRENCE is "Yes"
      EVIDENCE_OF_RECURRENCE_TYPE:
        required: false
        description: Required when PROGRESSION_OR_RECURRENCE is "Yes"
      AGE_IN_DAYS_AT_PROGRESSION_OR_RECURRENCE:
        required: false
        description: Required when PROGRESSION_OR_RECURRENCE is "Yes"
      ECOG_PERFORMANCE_STATUS:
        required: false
        description: Required when ECOG_PERFORMANCE_STATUS_IS_AVAILABLE is "Yes"
    rules:
      - description: "PROGRESSION_OR_RECURRENCE_ANATOMIC_SITE_UBERON_CODE is required when PROGRESSION_OR_RECURRENCE is Yes"
        preconditions:
          slot_conditions:
            PROGRESSION_OR_RECURRENCE:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            PROGRESSION_OR_RECURRENCE_ANATOMIC_SITE_UBERON_CODE:
              required: true
      - description: "PROGRESSION_OR_RECURRENCE_TYPE is required when PROGRESSION_OR_RECURRENCE is Yes"
        preconditions:
          slot_conditions:
            PROGRESSION_OR_RECURRENCE:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            PROGRESSION_OR_RECURRENCE_TYPE:
              required: true
      - description: "EVIDENCE_OF_RECURRENCE_TYPE is required when PROGRESSION_OR_RECURRENCE is Yes"
        preconditions:
          slot_conditions:
            PROGRESSION_OR_RECURRENCE:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            EVIDENCE_OF_RECURRENCE_TYPE:
              required: true
      - description: "AGE_IN_DAYS_AT_PROGRESSION_OR_RECURRENCE is required when PROGRESSION_OR_RECURRENCE is Yes"
        preconditions:
          slot_conditions:
            PROGRESSION_OR_RECURRENCE:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            AGE_IN_DAYS_AT_PROGRESSION_OR_RECURRENCE:
              required: true
      - description: "ECOG_PERFORMANCE_STATUS is required when ECOG_PERFORMANCE_STATUS_IS_AVAILABLE is Yes"
        preconditions:
          slot_conditions:
            ECOG_PERFORMANCE_STATUS_IS_AVAILABLE:
              equals_string: "Yes"
        postconditions:
          slot_conditions:
            ECOG_PERFORMANCE_STATUS:
              required: true