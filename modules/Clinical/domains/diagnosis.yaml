name: ClinicalDiagnosis
id: https://w3id.org/htan/clinical/diagnosis
description: HTAN Clinical Data Model - Diagnosis Domain

imports:
  - uberon_tissues
  - ncit_diagnosis

enums:
  ClinicalNStageEnum:
    title: clinical_n_stage
    permissible_values:
      "N0":
        description: A regional lymph node TNM finding indicating that there is no evidence of regional lymph node metastasis.
      "N0 (i+)":
        description: A regional lymph node TNM finding indicating that there are malignant cells in regional lymph node(s) no greater than 0.2 mm and are detected by hematoxylin and eosin stain or immunohistochemistry.
      "N0 (i-)":
        description: A regional lymph node TNM finding indicating that there is no evidence of regional lymph node metastasis histologically, and immunohistochemistry is negative.
      "N0 (mol+)":
        description: A regional lymph node TNM finding indicating that there is no evidence of regional lymph node metastasis histologically and by immunohistochemistry, but the molecular analysis (RT-PCR) is positive.
      "N0 (mol-)":
        description: A regional lymph node TNM finding indicating that there is no evidence of regional lymph node metastasis histologically and molecular analysis (RT-PCR) is negative.
      "N1":
        description: A general term that refers to a TNM finding of cancer metastases usually in a limited number of regional lymph nodes. The definition of N1 TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to micrometastases or metastases in 1-3 axillary lymph nodes; for cutaneous melanoma it refers to metastasis in 1 regional lymph node; for colorectal cancer it refers to metastases in 1-3 regional lymph nodes; and for bladder cancer it refers to metastasis in 1 regional lymph node in the true pelvis.
      "N1a":
        description: Breast cancer with metastasis in 1 to 3 axillary lymph nodes (at least 1 tumor deposit greater than 2.0 mm). (from AJCC 6th and 7th Eds.)
      "N1b":
        description: Breast cancer with metastasis in internal mammary lymph nodes with microscopic disease detected by sentinel lymph node dissection but not clinically apparent. (from AJCC 6th Ed.)
      "N1bI":
        description: A regional lymph node TNM finding indicating that there is metastasis to 1-3 nodes. The metastasis is greater than 2 mm and all are less than 20 mm.
      "N1bII":
        description: A regional lymph node TNM finding indicating that there is metastasis to four or more nodes. The metastasis is greater than 2 mm and all are less than 20 mm.
      "N1bIII":
        description: A regional lymph node TNM finding indicating that the tumor extends beyond the lymph node capsule and is less than 20 mm.
      "N1bIV":
        description: A regional lymph node TNM finding indicating that the metastases to the lymph nodes are more than 20 mm.
      "N1c":
        description: Breast cancer with metastasis in 1 to 3 axillary lymph nodes and in internal mammary nodes with microscopic disease detected by sentinel lymph node dissection but not clinically apparent. (from AJCC 6th Ed.)
      "N1mi":
        description: Breast cancer with micrometastases (greater than 0.2 mm and/or more than 200 cells, but none greater than 2.0 mm) (from AJCC 7th Ed.)
      "N2":
        description: A general term that refers to a TNM finding of cancer metastases in several regional lymph nodes. The definition of N2 TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to metastases in 4-9 axillary lymph nodes; for cutaneous melanoma it refers to metastases in 2-3 regional lymph nodes; for colorectal cancer it refers to metastases in 4 or more regional lymph nodes; and for bladder cancer it refers to metastases in multiple regional lymph nodes in the true pelvis.
      "N2a":
        description: A general term that refers to a TNM finding of cancer metastases in several regional lymph nodes. The definition of N2a TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to metastases in 4 to 9 axillary lymph nodes (at least 1 tumor deposit greater than 2.0 mm); for cutaneous melanoma it refers to micrometastases in 2-3 regional lymph nodes; for colorectal cancer it refers to metastases in 4-6 regional lymph nodes.
      "N2b":
        description: A general term that refers to a TNM finding of cancer metastases in several regional lymph nodes. The definition of N2b TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to metastases only in clinically detected ipsilateral internal mammary nodes and in the absence of clinically evident level I, II axillary lymph node metastases; for cutaneous melanoma it refers to macrometastases in 2-3 regional lymph nodes; for colorectal cancer it refers to metastases in seven or more regional lymph nodes.
      "N2c":
        description: A general term that refers to a TNM finding of cancer metastases in several regional lymph nodes. The definition of N2c TNM finding depends on the specific type of cancer that it refers to; for example, for cutaneous melanoma it refers to intralymphatic metastases (in transit or satellite metastases) without metastatic nodes; for lip and oral cavity cancer it refers to metastases in bilateral or contralateral lymph nodes, none more than 6 cm in greatest dimension.
      "N3":
        description: A general term that refers to a TNM finding of cancer metastases in multiple lymph nodes. The definition of N3 TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to metastases in 10 or more axillary lymph nodes; for cutaneous melanoma it refers to metastases in 4 or more regional lymph nodes; for gastric cancer it refers to metastases in 7 or more regional lymph nodes; and for bladder cancer it refers to metastases in common iliac lymph nodes.
      "N3a":
        description: A general term that refers to a TNM finding of cancer metastases in multiple lymph nodes. The definition of N3a TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to metastases in 10 or more axillary lymph nodes (at least one tumor deposit greater than 2.0 mm) or metastases to the infraclavicular (level III axillary) lymph nodes; for gastric cancer it refers to metastases in 7-15 regional lymph nodes; for nasopharyngeal cancer it refers to metastases to one or more lymph nodes greater than 6 cm in greatest dimension.
      "N3b":
        description: A general term that refers to a TNM finding of cancer metastases in multiple lymph nodes. The definition of N3b TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to metastases in clinically detected ipsilateral internal mammary lymph nodes in the presence of one or more positive axillary lymph nodes, or in more than 3 axillary lymph nodes and in internal mammary lymph nodes with micrometastases or macrometastases detected by sentinel lymph node biopsy but not clinically detected; for gastric cancer it refers to metastases in sixteen or more regional lymph nodes; for nasopharyngeal cancer it refers to extension to the supraclavicular fossa.
      "N3c":
        description: A general term that refers to a TNM finding of cancer metastases in multiple lymph nodes. The definition of N3c TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to metastases in ipsilateral supraclavicular lymph nodes.
      "N4":
        description: A general term that refers to a TNM finding of cancer metastases in multiple lymph nodes. The definition of N4 TNM finding depends on the specific type of cancer that it refers to; for example, for ocular adnexal lymphoma it refers to metastases to central lymph nodes.
      "NX":
        description: A regional lymph node TNM finding indicating that the status of regional lymph nodes cannot be assessed.
      "Not Reported":
        description: Not provided or available.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.

  ClinicalTStageEnum:
    title: clinical_t_stage
    permissible_values:
      "Not Reported":
        description: Not provided or available.
      "T0":
        description: A primary tumor TNM finding indicating that there is no evidence of primary tumor.
      "T1":
        description: A clinical and/or pathologic primary tumor TNM finding indicating that the cancer is limited to the site of growth.
      "T1a":
        description: A general term that refers to a TNM finding of a primary tumor limited to the site of growth. The definition of T1a TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to a primary tumor that is more than 0.1cm, but not more than 0.5 cm in greatest dimension; for kidney cancer it refers to a primary tumor that is 4 cm or less in greatest dimension; and for thyroid cancer it refers to a primary tumor that is 1 cm or less in greatest dimension.
      "T1a1":
        description: "A pathologic primary tumor TNM stage finding. The definition of pT1a stage finding depends on the particular type of cancer that it refers to; for example, for breast cancer, pT1a stage finding is defined as follows: cancer with tumor size more than 0.1 cm, but not more than 0.5 cm in greatest dimension; for lung cancer, pT1a stage finding is defined as follows: cancer with a tumor size of 2 cm or less in greatest dimension, surrounded by lung or visceral pleura and without bronchoscopic evidence of invasion more proximal than the lobar bronchus (i.e., not in the main bronchus). The uncommon superficial tumor of any size with its invasive component limited to the bronchial wall, which may extend proximal to the main bronchus, is also classified as T1a. (from AJCC 7th Ed.)"
      "T1a2":
        description: Invasive cervical cancer with measured stromal invasion more than 3.0 mm and not more than 5.0 mm with a horizontal spread 7.0 mm or less. (from AJCC 7th Ed.)
      "T1b":
        description: A general term that refers to a TNM finding of a primary tumor limited to the site of growth. The definition of T1b TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to a primary tumor that is more than 0.5 cm, but not more than 1.0 cm in greatest dimension; for kidney cancer it refers to a primary tumor that is more than 4 cm, but not more than 7 cm in greatest dimension; and for thyroid cancer it refers to a primary tumor that is more than 1 cm but not more than 2 cm in greatest dimension.
      "T1b1":
        description: Cervical cancer with clinically visible lesion 4.0 cm or less in greatest dimension confined to the cervix. (from AJCC 7th Ed.)
      "T1b2":
        description: Invasive cervical cancer with clinically visible lesion more than 4.0 cm in greatest dimension confined to the cervix. (from AJCC 7th Ed.)
      "T1c":
        description: A general term that refers to a TNM finding of a primary tumor limited to the site of growth. The definition of T1c TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to a primary tumor that is more than 1.0 cm, but not more than 2.0 cm in greatest dimension; for uterine corpus cancer it refers to a primary tumor that invades one-half or more of the myometrium; and for melanoma of the iris it refers to a primary tumor limited to the iris with secondary glaucoma.
      "T1mi":
        description: A term that refers to a TNM finding of a primary tumor limited to the site of growth and indicates microinvasion only.
      "T2":
        description: A general term that refers to a TNM finding of primary tumor growth beyond the level of in situ cancer, minimal subepithelial invasion, or minimal greatest diameter. The definition of T2 TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to primary tumor that is more than 2.0 cm, but not more than 5.0 cm in greatest dimension; for cutaneous melanoma it refers to primary tumor that is 1.01 to 2 mm in thickness, with or without ulceration; for colorectal cancer it refers to primary tumor with invasion into the muscularis propria; and for bladder cancer it refers to primary tumor with invasion into the muscle layer.
      "T2a":
        description: A general term that refers to a TNM finding of a primary tumor growth beyond the level of in situ cancer, minimal subepithelial invasion, or minimal greatest diameter. The definition of T2a TNM finding depends on the specific type of cancer that it refers to; for example, for kidney cancer it refers to a primary tumor that measures more than 7 cm but less than or equal to 10 cm in greatest dimension, and is limited to the kidney; for bladder cancer it refers to a primary tumor that invades the superficial muscularis propria (inner half); for cervical cancer it refers to a primary tumor that invades beyond the uterus but not to the pelvic wall or to the lower third of vagina and there is no parametrial invasion.
      "T2a1":
        description: Cervical cancer invades beyond uterus but not to pelvic wall or to lower third of vagina. There is no parametrial invasion. Clinically visible lesions 4.0 cm or less in greatest dimension are present. (from AJCC 7th Ed.)
      "T2a2":
        description: Cervical cancer invades beyond uterus but not to pelvic wall or to lower third of vagina. There is no parametrial invasion. Clinically visible lesions more than 4.0 cm in greatest dimension are present. (from AJCC 7th Ed.)
      "T2b":
        description: A general term that refers to a TNM finding of a primary tumor growth beyond the level of in situ cancer, minimal subepithelial invasion, or minimal greatest diameter. The definition of T2b TNM finding depends on the specific type of cancer that it refers to; for example, for kidney cancer it refers to a primary tumor that measures more than 10 cm in greatest dimension, and is limited to the kidney; for bladder cancer it refers to a primary tumor that invades the deep muscularis propria (outer half); for cervical cancer it refers to a primary tumor that invades beyond the uterus but not to the pelvic wall or to the lower third of vagina and there is parametrial invasion.
      "T2c":
        description: A general term that refers to a TNM finding of a primary tumor growth beyond the level of in situ cancer, minimal subepithelial invasion, or minimal greatest diameter. The definition of T2c TNM finding depends on the specific type of cancer that it refers to; for example, for prostate cancer it refers to a primary tumor that involves both lobes of the prostate gland; for ovarian cancer it refers to a primary tumor that involves one or both ovaries with extension or implants on the uterus and/or fallopian tubes, or other pelvic tissues, with malignant cells in either ascites or peritoneal washings; for fallopian tube cancer it refers to a primary tumor with pelvic extension and malignant cells in ascites or peritoneal washings.
      "T2d":
        description: Tumor size category 2 with ciliary body involvement and extraocular extension less than or equal to 5 mm in diameter. (from AJCC 7th Ed.)
      "T3":
        description: A clinical and/or pathologic primary tumor TNM finding usually indicating that the cancer is locally invasive, without infiltration of adjacent structures.
      "T3a":
        description: A general term that refers to a TNM finding of a primary tumor usually indicating that the cancer is locally invasive. The definition of T3a TNM finding depends on the specific type of cancer that it refers to; for example, for kidney cancer it refers to a primary tumor that grossly extends into the renal vein or its segmental (muscle containing) branches or the tumor invades perirenal and/or renal sinus fat but does not extends beyond Gerota's fascia; for cervical cancer it refers to a primary tumor that involves the lower third of vagina, without extension to pelvic wall; for liver cancer it refers to the presence of multiple tumors measuring more than 5 cm in greatest dimension.
      "T3b":
        description: A general term that refers to a TNM finding of a primary tumor usually indicating that the cancer is locally invasive. The definition of T3b TNM finding depends on the specific type of cancer that it refers to; for example, for kidney cancer it refers to a primary tumor that grossly extends into the vena cava below the diaphragm; for cervical cancer it refers to a primary tumor that extends to the pelvic wall and/or causes hydronephrosis or nonfunctioning kidney; for liver cancer it refers to a single tumor or multiple tumors of any size involving a major branch of the portal vein or hepatic vein.
      "T3c":
        description: A general term that refers to a TNM finding of a primary tumor usually indicating that the cancer is locally invasive. The definition of T3c TNM finding depends on the specific type of cancer that it refers to; for example, for kidney cancer it refers to a primary tumor that grossly extends into the vena cava above the diaphragm, or invades the wall of the vena cava; for fallopian tube cancer it refers to a primary tumor with peritoneal metastasis outside the pelvis measuring more than 2 cm in diameter; for melanoma of the conjunctiva it refers to a primary tumor invading the orbit.
      "T3d":
        description: Tumor size category 3 with ciliary body involvement and extraocular extension less than or equal to 5 mm in diameter. (from AJCC 7th Ed.)
      "T4":
        description: A clinical and/or pathologic primary tumor TNM finding indicating direct invasion of adjacent structures by cancer.
      "T4a":
        description: A general term that refers to a TNM finding of a primary tumor with direct invasion of adjacent structures. The definition of T4a TNM finding depends on the specific type of cancer that it refers to; for example, for bladder cancer it refers to a primary tumor that invades the prostatic stroma, uterus, and vagina; for gastric cancer it refers to a primary tumor that invades the serosa (visceral peritoneum); for colorectal cancer it refers to a primary tumor that penetrates to the surface of the visceral peritoneum.
      "T4b":
        description: A general term that refers to a TNM finding of a primary tumor with direct invasion of adjacent structures. The definition of T4b TNM finding depends on the specific type of cancer that it refers to; for example, for bladder cancer it refers to a primary tumor that invades the pelvic wall and abdominal wall; for gastric cancer it refers to a primary tumor that invades adjacent structures; for colorectal cancer it refers to a primary tumor with direct invasion or adherence to other organs or structures.
      "T4c":
        description: A general term that refers to a TNM finding of a primary tumor with direct invasion of adjacent structures. The definition of T4c TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to a primary tumor that extends to the chest wall, not including the pectoralis muscle, and with edema (including peau d'orange) or ulceration of the skin of the breast or satellite skin nodules confined to the same breast; for ocular adnexal lymphoma it refers to a primary tumor that Involves the maxillofacial, ethmoidal, and/or frontal sinuses; for carcinoma of the conjunctiva it refers to a primary tumor that invades adjacent paranasal sinuses.
      "T4d":
        description: A general term that refers to a TNM finding of a primary tumor with direct invasion of adjacent structures. The definition of T4d TNM finding depends on the specific type of cancer that it refers to; for example, for breast cancer it refers to a primary tumor that meets the clinical-pathologic criteria of inflammatory carcinoma; for ocular adnexal lymphoma it refers to a primary tumor with intracranial spread; for carcinoma of the conjunctiva it refers to a primary tumor that invades the brain.
      "T4e":
        description: Any tumor size category with extraocular extension more than 5 mm in diameter. (from AJCC 7th Ed.)
      "T5":
        description: An antiquated primary tumor finding term that refers to colorectal cancer which has spread by direct extension beyond the immediately adjacent organs or tissues. (AJCC 1st Ed.)
      "TX":
        description: A primary tumor TNM finding indicating that the status of the primary tumor cannot be assessed.
      "Ta":
        description: A term that refers to a TNM finding of a primary, non-invasive, papillary cancer.
      "Tis":
        description: Breast cancer with a finding of carcinoma in situ. (from AJCC 6th and 7th Eds.)
      "Tis (DCIS)":
        description: "A term that refers to a TNM finding of a primary tumor microscopically defined as carcinoma in situ.: A carcinoma entirely confined to the mammary ducts. It is also known as DCIS. There is no evidence of invasion of the basement membrane. Currently, it is classified into three categories: High-grade DCIS, intermediate-grade DCIS and low-grade DCIS. In this classification the DCIS grade is defined by a combination of nuclear grade, architectural growth pattern and presence of necrosis. The size of the lesion as well as the grade and the clearance margins play a major role in dictating the most appropriate therapy for DCIS."
      "Tis (LCIS)":
        description: "A term that refers to a TNM finding of a primary tumor microscopically defined as carcinoma in situ.: A non-invasive adenocarcinoma of the breast characterized by a proliferation of monomorphic cells completely filling the lumina. The overall lobular architecture is preserved. It is frequently multifocal (90% in some series) and bilateral. It seldom becomes invasive; however there is an increased risk of infiltrating ductal adenocarcinoma."
      "Tis (Paget's)":
        description: "A term that refers to a TNM finding of a primary tumor microscopically defined as carcinoma in situ.: Paget disease involving the skin overlying the mammary gland, without accompanying invasive ductal or lobular breast carcinoma."
      "Unknown":
        description: Not known, not observed, not recorded, or refused.

  TumorGradeEnum:
    title: tumor_grade
    permissible_values:
      "G1 Low Grade":
        description: A morphologic qualifier indicating that a cancerous lesion is well differentiated.
      "G2 Intermediate Grade":
        description: A morphologic qualifier indicating that a cancerous lesion is moderately differentiated.
      "G3 High Grade":
        description: A morphologic qualifier indicating that a cancerous lesion is poorly differentiated.
      "G4 Anaplastic":
        description: A morphologic qualifier indicating that a cancerous lesion is undifferentiated.
      "GB Borderline":
        description: A morphologic qualifier indicating that a neoplasm is of borderline malignancy.
      "GX Grade Cannot Be Assessed":
        description: A morphologic qualifier indicating that the grade of a neoplasm cannot be assessed.
      "Not Applicable":
        description: Determination of a value is not relevant in the current context.
      "Not Reported":
        description: Not provided or available.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.

  TumorStageEnum:
    title: tumor_stage
    permissible_values:
      "Stage I":
        description: Stage I
      "Stage IA":
        description: Stage IA
      "Stage IB":
        description: Stage IB
      "Stage II":
        description: Stage II
      "Stage IIA":
        description: Stage IIA
      "Stage IIB":
        description: Stage IIB
      "Stage III":
        description: Stage III
      "Stage IIIA":
        description: Stage IIIA
      "Stage IIIB":
        description: Stage IIIB
      "Stage IIIC":
        description: Stage IIIC
      "Stage IV":
        description: Stage IV
      "Stage IVA":
        description: Stage IVA
      "Stage IVB":
        description: Stage IVB
      "Stage IVC":
        description: Stage IVC
      "Not Reported":
        description: Not provided or available
      "Unknown":
        description: Not known, not observed, not recorded, or refused

  ClinicalMStageEnum:
    title: clinical_m_stage
    permissible_values:
      "M0":
        description: A distant metastasis TNM finding indicating that there is no evidence of distant metastasis.
      "M1":
        description: A clinical and/or pathologic distant metastasis TNM finding indicating the spread of cancer to distant anatomic sites.
      "M1a":
        description: A TNM finding indicating the spread of cancer to distant anatomic sites. The definition of M1a TNM finding depends on the specific type of cancer that it refers to; for example, for colorectal cancer it refers to metastasis confined to one organ or site (e.g., liver, lung, ovary, nonregional node); for prostate cancer it refers to metastasis to non-regional lymph node(s); for bone cancer it refers to metastasis to the lung.
      "M1b":
        description: A TNM finding indicating the spread of cancer to distant anatomic sites. The definition of M1b TNM finding depends on the specific type of cancer that it refers to; for example, for colorectal cancer it refers to metastases in more than one organ/site or the peritoneum; for prostate cancer it refers to metastasis to bone(s); for bone cancer it refers to metastasis to distant sites other than lung.
      "M1c":
        description: A TNM finding indicating the spread of cancer to distant anatomic sites. The definition of M1c TNM finding depends on the specific type of cancer that it refers to; for example, for prostate cancer it refers to metastasis to anatomic site(s) other than bone, with or without bone disease; for retinoblastoma it refers to central nervous system metastasis; for melanoma of the uvea it refers to distant metastasis, with the largest diameter of the largest metastasis measuring 8.0 cm or more.
      "MX":
        description: A distant metastasis TNM finding indicating that the status of distant metastasis cannot be assessed.
      "Not Reported":
        description: Not provided or available.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.
      "cM0 (i+)":
        description: A distant metastasis TNM finding indicating that there is no evidence of distant metastasis clinically or by radiologic studies, but there are small numbers of cells detected by special studies in the blood and bone marrow, or there is tiny metastasis (no larger than 0.2 mm) detected in nonregional lymph nodes.

  AJCCStagingSystemEditionEnum:
    title: ajcc_staging_system_edition
    permissible_values:
      "1st":
        description: "Preceding all others in time or space or degree.: The form in which a text (especially a printed book) is published."
      "2nd":
        description: "Coming next after the first in position in space or time or degree or magnitude.: The form in which a text (especially a printed book) is published."
      "3rd":
        description: "Following the second position in an ordering or series; coming next after the second and just before the fourth in position.: The form in which a text (especially a printed book) is published."
      "4th":
        description: "Following the third position in an ordering or series; coming next after the third and just before the fifth in position.: The form in which a text (especially a printed book) is published."
      "5th":
        description: "Following the fourth position in an ordering or series; coming next after the fourth and just before the sixth in position.: The form in which a text (especially a printed book) is published."
      "6th":
        description: "Following the fifth position in an ordering or series; coming next after the fifth and just before the seventh in position.: The form in which a text (especially a printed book) is published."
      "7th":
        description: "A natural number greater than 6 and less than 8 and the quantity that it denotes: the sum of six and one.: The form in which a text (especially a printed book) is published."
      "8th":
        description: "A natural number greater than 7 and less than 9 and the quantity that it denotes: the sum of seven and one.: The form in which a text (especially a printed book) is published."

  AJCCTumorStagingAvailableEnum:
    title: ajcc_tumor_staging_available
    permissible_values:
      "No":
        description: The AJCC staging information is not available to report.
      "Unknown":
        description: It is not known whether AJCC staging information is available.
      "Yes":
        description: The AJCC staging information is available to report.

  LastKnownDiseaseStatusEnum:
    title: last_known_disease_status
    permissible_values:
      "Biochemical evidence of disease without structural correlate":
        description: An indication that biochemical markers of a disease are present but morphological markers are absent.
      "Distant Metastasis":
        description: A biological process that involves the transfer and growth of cancer cells from the site of the primary tumor. Relocation of malignant cells during metastasis can be restricted to movement within a specific tissue/organ or may entail migration to a distal locus within the body. This phenotype is a characteristic of all malignant tumors.
      "Localized Disease":
        description: A disease that is confined to a specific organ or tissue and has not spread to other anatomic sites.
      "New Tumor Event":
        description: The presence of a primary, recurrent or metastatic neoplasm which has not been previously noted.
      "Not Allowed To Collect":
        description: An indicator that specifies that a collection event was not permitted.
      "Not Applicable":
        description: Determination of a value is not relevant in the current context.
      "Not Reported":
        description: Not provided or available.
      "Regional Disease":
        description: A disease or condition that extends beyond the site and spreads into adjacent tissues and regional lymph nodes.
      "Tumor Free":
        description: There is no evidence of a tumor in the individual.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.
      "With Tumor":
        description: There is evidence of a tumor in an individual.

  TumorClassificationCategoryEnum:
    title: tumor_classification_category
    permissible_values:
      "Metastatic":
        description: A tumor that has spread from its original (primary) site of growth to another site, close to or distant from the primary site. Metastasis is characteristic of advanced malignancies, but in rare instances can be seen in neoplasms lacking malignant morphology. -- 2004
      "Not Applicable":
        description: Determination of a value is not relevant in the current context.
      "Not Reported":
        description: Not provided or available.
      "Premalignant":
        description: A neoplasm that is composed of dysplastic cells and there is no morphologic evidence of infiltration of the surrounding tissues.
      "Primary":
        description: A tumor at the original site of origin.
      "Prior Primary":
        description: Recurrence of symptoms of a disease at the original site.
      "Progression":
        description: A clinical, pathologic, and/or molecular finding indicating that the course of a disease is worsening in terms of extent or severity.
      "Recurrent":
        description: The reemergence of neoplasm after a period of remission
      "Synchronous Primary":
        description: A malignant neoplasm arising in multiple primary sites.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.
      "Xenograft":
        description: The transfer of cells, tissues, or organs from a donor into a recipient of another species.

  MetastasisAtDiagnosisEnum:
    title: metastasis_at_diagnosis
    permissible_values:
      "Metastatic":
        description: A term referring to the clinical or pathologic observation of a tumor extension from its original site of growth to another anatomic site.
      "Non-metastatic (confirmed)":
        description: "An operation in which a term denies or inverts the meaning of another term or construction.: A term referring to the clinical or pathologic observation of a tumor extension from its original site of growth to another anatomic site.: Confirmed; having been established or verified."
      "Non-metastatic (unconfirmed)":
        description: "An operation in which a term denies or inverts the meaning of another term or construction.: A term referring to the clinical or pathologic observation of a tumor extension from its original site of growth to another anatomic site.: An operation in which a term denies or inverts the meaning of another term or construction.: Confirmed; having been established or verified."
      "Unknown":
        description: Not known, observed, recorded; or reported as unknown by the data contributor.

  MethodOfDiagnosisEnum:
    title: method_of_diagnosis
    permissible_values:
      "Autopsy":
        description: Autopsy; an examination and dissection of a dead body to determine cause of death or the changes produced by disease.
      "Biopsy":
        description: The removal of tissue specimens or fluid from the living body for microscopic examination, performed to establish a diagnosis.
      "Blood Sample":
        description: A small volume of blood removed for testing or storage.
      "Bone Marrow Aspirate":
        description: Aspirate from bone marrow.
      "Core Biopsy":
        description: The removal of a tissue sample using a needle with a relatively large diameter, for microscopic examination.
      "Cystoscopy":
        description: Endoscopic examination of the urinary bladder or urethra.
      "Diagnostic Imaging":
        description: Any method that uses a visual display of structural or functional patterns of organs or tissues for diagnostic evaluation.
      "Dilation and Curettage":
        description: A surgical scraping and removal of the inner lining of the uterus through direct dilation of the uterine cervix.
      "Enucleation":
        description: A surgical procedure by which tissue or an organ (usually containing a tumor) is removed without rupture from a specific anatomic site.
      "Excisional Biopsy":
        description: A surgical procedure in which an entire lesion is removed for microscopic examination.
      "Fine Needle Aspiration":
        description: The removal of tissue or fluid with a thin needle for examination under a microscope.
      "Histopathology":
        description: The microscopic study of characteristic tissue abnormalities by employing various cytochemical and immunocytochemical stains. -- 2004
      "Imaging Technique":
        description: Any technology or method that aids in the visualization of any biological process, cell, tissue or organ for use in screening, diagnosis, surgical procedures or therapy.
      "Incisional Biopsy":
        description: A surgical procedure in which part of a lesion is removed for microscopic examination.
      "Laparoscopy":
        description: Laparoscopic examination of the abdominal cavity and its contents.
      "Laparotomy":
        description: Creation of a surgical opening into the abdominal cavity.
      "Magnetic Resonance Imaging Study File":
        description: Imaging that uses radiofrequency waves and a strong magnetic field rather than x-rays to provide amazingly clear and detailed pictures of internal organs and tissues. The technique is valuable for the diagnosis of many pathologic conditions, including cancer, heart and vascular disease, stroke, and joint and musculoskeletal disorders.
      "Not Reported":
        description: Not provided or available.
      "Pap Smear":
        description: A biospecimen collection and staining procedure in which secretions and superficial cells of the cervix are collected and stained with the Papanicolaou stain followed by microscopic examination to identify the presence of abnormal cells.
      "Pathologic Review":
        description: An assessment of disease process to include cause, development, and/or structural and functional changes associated with the disease.
      "Physical Examination":
        description: A systemic evaluation of the body and its functions using visual inspection, palpation, percussion and auscultation. The purpose is to determine the presence or absence of physical signs of disease or abnormality for an individual's health assessment.
      "Surgical Resection":
        description: The surgical removal of an organ or a part of an organ.
      "Thoracentesis":
        description: The removal of excess fluid via needle puncture from the thoracic cavity.
      "Tumor Debulking":
        description: The surgical removal of as much of a malignant tumor as is reasonably possible. This procedure increases the effectiveness of the subsequent administration of chemotherapy and/or radiation therapy.
      "Ultrasound Guided Biopsy":
        description: A biopsy procedure that uses an ultrasound imaging device to find an abnormal area of tissue and guide its removal for examination under a microscope.
      "Ultrasound Imaging":
        description: A technique in which high-frequency sound waves are bounced off internal organs and the echo pattern is converted into a 2 dimensional picture of the structures beneath the transducer.
      "Unknown":
        description: Not known, not observed, not recorded, or refused.

classes:
  Diagnosis:
    is_a: ClinicalRecordAttributes
    description: Information about the diagnosis
    attributes:
      PRIMARY_DIAGNOSIS_NCI_THESAURUS_ID:
        range: PrimaryDiagnosisNCIThesaurusIDEnum
        required: true
        title: "Primary Diagnosis NCI Thesaurus ID"
        description: "NCI Thesaurus concept identifier for primary diagnosis. Note that NCI Thesaurus offers very broad and very granular cancer types. Please select the most granular disease term most relevant to your research atlas. For example, for Ovarian Cancer, use: C4908: Ovarian Carcinoma, and not a more specific code such as: C139964: Stage I Ovarian Cancer AJCC v8. (caDSR:14905532) (Aligns to CDRC Standard CDE)"
        slot_uri: caDSR:14905532
      AGE_IN_DAYS_AT_DIAGNOSIS:
        range: integer
        required: true
        title: "Age in Days at Diagnosis"
        description: Age at the time of diagnosis expressed in number of days since birth. Use -1 if this data point is not available. (caDSR:15019300) (No CRDC Standard Available)
        slot_uri: caDSR:15019300
      TISSUE_OR_ORGAN_OF_ORIGIN_UBERON_CODE:
        range: tissue_or_organ_of_origin_uberon_enum
        required: true
        title: "Tissue or Organ of Origin UBERON Code"
        description: UBERON identifier indicating the tissue or organ where the disease of interest originated, e.g. UBERON:0000002. (caDSR:14883047) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:14883047
      TUMOR_GRADE:
        range: TumorGradeEnum
        required: true
        title: "Tumor Grade"
        description: Degree of abnormality of cancer cells as a measure of differentiation and aggressiveness. (caDSR:11325685) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:11325685
      CLINICAL_T_STAGE:
        range: ClinicalTStageEnum
        required: true
        title: "Clinical T Stage"
        description: Extent of spread of the primary cancer based on evidence obtained from clinical assessment parameters determined prior to treatment. (caDSR:3440328) (Aligns to CRDC Node)
        slot_uri: caDSR:3440328
      CLINICAL_N_STAGE:
        range: ClinicalNStageEnum
        required: true
        title: "Clinical N Stage"
        description: Extent of the regional lymph node involvement for the cancer based on evidence obtained from clinical assessment parameters determined prior to treatment. (caDSR:3440330) (Aligns to CRDC Node)
        slot_uri: caDSR:3440330
      CLINICAL_M_STAGE:
        range: ClinicalMStageEnum
        required: true
        title: "Clinical M Stage"
        description: Extent of the distant metastasis for the cancer based on evidence obtained from clinical assessment parameters determined prior to treatment. (caDSR:3440331) (Aligns to CRDC Node)
        slot_uri: caDSR:3440331
      AJCC_TUMOR_STAGING_AVAILABLE:
        range: AJCCTumorStagingAvailableEnum
        required: true
        title: "AJCC Tumor Staging Available"
        description: Indicates whether AJCC staging information is available to report. If No or Unknown, AJCC_STAGING_SYSTEM_EDITION is expected to be null; CLINICAL_T_STAGE, CLINICAL_N_STAGE, and CLINICAL_M_STAGE should be set to Not Reported or Unknown.
      AJCC_STAGING_SYSTEM_EDITION:
        range: AJCCStagingSystemEditionEnum
        title: "AJCC Staging System Edition"
        description: Version or edition of the American Joint Committee on Cancer Cancer Staging Handbooks used to guide TMN clinical staging in CLINICAL_T_STAGE, CLINICAL_M_STAGE and CLINICAL_N_STAGE fields. (caDSR:2722309) (Aligns to CRDC Node) Required when AJCC_TUMOR_STAGING_AVAILABLE is Yes.
        slot_uri: caDSR:2722309
      AGE_IN_DAYS_AT_LAST_KNOWN_DISEASE_STATUS:
        range: integer
        required: true
        title: "Age in Days at Last Known Disease Status"
        description: Age in days of subject at the time of their last known disease status. Use -1 if this data point is not available. (caDSR:14589579) (No CRDC Standard Available)
        slot_uri: caDSR:14589579
      LAST_KNOWN_DISEASE_STATUS:
        range: LastKnownDiseaseStatusEnum
        required: true
        title: "Last Known Disease Status"
        description: Most recently documented condition or state of an individual's disease. (caDSR:12447172) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:12447172
      TUMOR_CLASSIFICATION_CATEGORY:
        range: TumorClassificationCategoryEnum
        required: true
        title: "Tumor Classification Category"
        description: Classification of a tumor at a particular time based primarily on histopathological characteristics. (caDSR:12922545) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:12922545
      METASTASIS_AT_DIAGNOSIS:
        range: MetastasisAtDiagnosisEnum
        required: true
        title: "Metastasis at Diagnosis"
        description: State of metastatic disease at the time of primary tumor diagnosis. (caDSR:3438571) (Aligns to CDRC Standard CDE)
        slot_uri: caDSR:3438571
      METHOD_OF_DIAGNOSIS:
        range: MethodOfDiagnosisEnum
        required: true
        title: "Method of Diagnosis"
        description: Type of clinical or laboratory procedure(s) used in the determination of a disease diagnosis. (caDSR:14857681) (Aligns to CRDC Node)
        slot_uri: caDSR:14857681