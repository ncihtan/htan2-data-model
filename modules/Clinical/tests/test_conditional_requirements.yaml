HTAN_PARTICIPANT_ID: "HTA200_0000"

# Valid demographics data
DEMOGRAPHICS:
  ETHNIC_GROUP: "Not Hispanic or Latino"  # Valid enum value
  GENDER_IDENTITY: "Male"  # Valid enum value
  SEX: "Male"  # Valid enum value
  RACE: "White"  # Valid enum value
  HTAN_PARTICIPANT_ID: "HTA200_0000"

# Valid exposure data
EXPOSURES:
  SMOKING_HISTORY: "Former Smoker"  # Valid enum value
  YEARS_SMOKED: 20
  PACK_YEARS_SMOKED: 10
  ALCOHOL_HISTORY_INDICATOR: "Yes"  # Valid enum value
  ENVIRONMENTAL_EXPOSURE: "Yes"  # Valid enum value
  ENVIRONMENTAL_EXPOSURE_TYPE: "Chemical Exposure"  # Valid enum value
  HTAN_PARTICIPANT_ID: "HTA200_0000"

# Valid family history data with conditional requirements
FAMILY_HISTORY:
  FAMILY_MEMBER_CANCER_HISTORY: "Yes"  # Valid enum value
  RELATIVES_WITH_CANCER_HISTORY: 2  # Required when FAMILY_MEMBER_CANCER_HISTORY is "Yes"
  HTAN_PARTICIPANT_ID: "HTA200_0000"

# Valid follow-up data with conditional requirements
FOLLOW_UPS:
  - AGE_IN_DAYS_AT_FOLLOWUP: 20000
    PROGRESSION_OR_RECURRENCE: "Yes"  # Valid enum value - triggers conditional requirements
    PROGRESSION_OR_RECURRENCE_ANATOMIC_SITE_UBERON_CODE: "UBERON:0000002"  # Required when PROGRESSION_OR_RECURRENCE indicates progression/recurrence
    PROGRESSION_OR_RECURRENCE_TYPE: "Local"  # Required when PROGRESSION_OR_RECURRENCE indicates progression/recurrence
    EVIDENCE_OF_RECURRENCE_TYPE: "Convincing Image (i.e. CT/PET/MRI)"  # Required when PROGRESSION_OR_RECURRENCE indicates progression/recurrence
    AGE_IN_DAYS_AT_PROGRESSION_OR_RECURRENCE: 18000  # Required when PROGRESSION_OR_RECURRENCE indicates progression/recurrence
    DISEASE_RESPONSE: "Stable Disease"  # Valid enum value
    ECOG_PERFORMANCE_STATUS_IS_AVAILABLE: "Yes"  # Valid enum value - triggers conditional ECOG requirement
    ECOG_PERFORMANCE_STATUS: "0"  # Valid enum value - required when ECOG_PERFORMANCE_STATUS_IS_AVAILABLE is "Yes"
    MENOPAUSE_STATUS: "Premenopausal"  # Valid enum value
    HTAN_PARTICIPANT_ID: "HTA200_0000"

# Valid molecular test data
MOLECULAR_TESTS:
  - TIMEPOINT_LABEL: "Baseline"  # Valid enum value
    AGE_IN_DAYS_AT_MOLECULAR_TEST_START: 0
    AGE_IN_DAYS_AT_MOLECULAR_TEST_STOP: 1
    GENE_SYMBOL: "BRCA1"
    MOLECULAR_ANALYSIS_METHOD: "WGS"  # Valid enum value (Whole Genome Sequencing)
    MOLECULAR_ANALYSIS_RESULT: "Positive"  # Valid enum value (indicates positive finding)
    AA_CHANGE: "R1443X"
    CLINICAL_BIOSPECIMEN_TYPE: "BLOOD"  # Valid enum value
    COPY_NUMBER: 2
    EXON: 11
    MOLECULAR_CONSEQUENCE: "Stop Gained"  # Valid enum value (nonsense mutation creates stop codon)
    PATHOGENICITY: "Pathogenic"  # Valid enum value
    TEST_ANALYTE_TYPE: "DNA"  # Valid enum value
    TEST_UNITS: "Copies"  # Valid enum value
    TEST_RESULT: "Positive"  # Valid enum value
    VARIANT_ORIGIN: "Germline"  # Valid enum value
    VARIANT_TYPE: "Substitution"  # Valid enum value
    HTAN_PARTICIPANT_ID: "HTA200_0000"

# Valid vital status data
VITAL_STATUS:
  VITAL_STATUS: "Dead"  # Valid enum value
  AGE_IN_DAYS_AT_LAST_KNOWN_SURVIVAL_STATUS: 15000
  AGE_IN_DAYS_AT_DEATH: 15000  # Required when VITAL_STATUS is "Dead"
  CAUSE_OF_DEATH: "Cancer Related"  # Required when VITAL_STATUS is "Dead"
  CAUSE_OF_DEATH_SOURCE: "Death Certificate"  # Required when VITAL_STATUS is "Dead"
  HTAN_PARTICIPANT_ID: "HTA200_0000"

# Valid diagnosis data
DIAGNOSIS:
  PRIMARY_DIAGNOSIS_NCI_THESAURUS_ID: "C4908"  # Valid NCI Thesaurus ID enum value
  AGE_IN_DAYS_AT_DIAGNOSIS: 18250
  TISSUE_OR_ORGAN_OF_ORIGIN_UBERON_CODE: "UBERON:0000310"
  TUMOR_GRADE: "G2 Intermediate Grade"  # Valid enum value
  TUMOR_STAGED: "Yes"  # Valid enum value - triggers conditional staging requirements
  CLINICAL_T_STAGE: "T2"  # Valid enum value - required when TUMOR_STAGED is "Yes"
  CLINICAL_N_STAGE: "N1"  # Valid enum value
  CLINICAL_M_STAGE: "M0"  # Valid enum value
  AJCC_STAGING_SYSTEM_EDITION: "8th"  # Valid enum value
  AGE_IN_DAYS_AT_LAST_KNOWN_DISEASE_STATUS: 19000
  LAST_KNOWN_DISEASE_STATUS: "Distant Metastasis"  # Valid enum value
  TUMOR_CLASSIFICATION_CATEGORY: "Primary"  # Valid enum value
  METASTASIS_AT_DIAGNOSIS: "Non-metastatic (confirmed)"  # Valid enum value
  METHOD_OF_DIAGNOSIS: "Biopsy"  # Valid enum value
  HTAN_PARTICIPANT_ID: "HTA200_0000"

# Valid therapy data
THERAPIES:
  - INITIAL_DISEASE_STATUS: "Primary"  # Valid enum value
    TREATMENT_INTENT_TYPE: "Curative"  # Valid enum value
    TREATMENT_TYPE: "Surgical Procedure"  # Valid enum value - THERAPEUTIC_AGENTS and REGIMEN not required for this type
    THERAPY_ANATOMIC_SITE_UBERON_CODE: "UBERON:0000002"  # Required when TREATMENT_TYPE is surgical or radiation
    PHARMACOTHERAPY_TYPE: "Not Applicable"  # Valid enum value
    AGE_IN_DAYS_AT_TREATMENT_START: 18350
    AGE_IN_DAYS_AT_TREATMENT_END: 18600
    OFF_TREATMENT_REASON: "Treatment Complete"  # Required when AGE_IN_DAYS_AT_TREATMENT_END is present
    NUMBER_OF_CYCLES: -1
    RESPONSE: "Complete Response"  # Required when AGE_IN_DAYS_AT_TREATMENT_END is present
    HTAN_PARTICIPANT_ID: "HTA200_0000"
  - INITIAL_DISEASE_STATUS: "Progression or Recurrence"  # Valid enum value
    TREATMENT_INTENT_TYPE: "Palliative"  # Valid enum value
    TREATMENT_TYPE: "Chemotherapy"  # Valid enum value - triggers THERAPEUTIC_AGENTS and REGIMEN requirement
    PHARMACOTHERAPY_TYPE: "Single Drug Therapy"  # Valid enum value
    THERAPEUTIC_AGENTS:
      - "Doxorubicin"  # Valid NCIt Preferred Name - required when TREATMENT_TYPE is Chemotherapy
    AGE_IN_DAYS_AT_TREATMENT_START: 18700
    AGE_IN_DAYS_AT_TREATMENT_END: 18900
    OFF_TREATMENT_REASON: "Treatment Complete"  # Required when AGE_IN_DAYS_AT_TREATMENT_END is present
    REGIMEN_OR_LINE_OF_THERAPY: "2"  # Required when TREATMENT_TYPE is Chemotherapy
    NUMBER_OF_CYCLES: 3
    RESPONSE: "Partial Response"  # Required when AGE_IN_DAYS_AT_TREATMENT_END is present
    HTAN_PARTICIPANT_ID: "HTA200_0000"