name: DigitalPathology
id: https://w3id.org/htan/digital_pathology
description: HTAN Digital Pathology Data Model Schema for Phase 2

imports:
  - linkml:types
  - linkml:extensions
  - ../../Imaging/domains/imaging

prefixes:
  htan: https://w3id.org/htan/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/

default_prefix: htan

enums:
  AnnotationType:
    permissible_values:
      "Artifact":
        description: Artifact annotation
      "Cell":
        description: Cell annotation
      "Nucleus":
        description: Nucleus annotation
      "ROI":
        description: Region of Interest annotation
      "Tissue":
        description: Tissue annotation

classes:
  DigitalPathologyData:
    is_a: BaseImagingAttributes
    description: Container for digital pathology imaging data
    attributes:
      # File format restriction for Level 2 imaging data
      FILE_FORMAT:
        range: string
        required: true
        title: "File Format"
        description: Format of the imaging file. Must be compatible with Bio-Formats or OpenSlide Python. OME-TIFF files use extensions .ome.tif, .ome.tiff, .ome.tf2, .ome.tf8, or .ome.btf
        pattern: "^(ome-tiff|tiff|qptiff|svs)$"
      FILENAME:
        range: string
        required: true
        title: "File Name"
        description: Name of the file. Must end with an extension matching the FILE_FORMAT (.ome.tif, .ome.tiff, .ome.tf2, .ome.tf8, .ome.btf for ome-tiff; .tiff or .tif for tiff; .qptiff for qptiff; .svs for svs)
        pattern: "^.+\\.(ome\\.(tif|tiff|tf2|tf8|btf)|tiff?|qptiff|svs)$"
      
      # Digital Pathology specific attributes
      HAS_ANNOTATIONS:
        range: boolean
        required: true
        title: "Has Annotations"
        description: Does the image contain annotations

      ANNOTATION_TYPE:
        range: AnnotationType
        required: false
        title: "Annotation Type"
        description: What types of annotation are contained in the image

    slot_usage:
      ANNOTATION_TYPE:
        required: false
        description: Required when HAS_ANNOTATIONS is true
    rules:
      - description: "ANNOTATION_TYPE is required when HAS_ANNOTATIONS is true"
        preconditions:
          slot_conditions:
            HAS_ANNOTATIONS:
              pattern: "^true$"
        postconditions:
          slot_conditions:
            ANNOTATION_TYPE:
              required: true
