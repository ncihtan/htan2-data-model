name: Sequencing
id: https://w3id.org/htan/sequencing
description: HTAN Base Sequencing Data Model - Common attributes shared across all sequencing modules
imports:
  - linkml:types
  - ../../CoreFile/domains/core
prefixes:
  htan: https://w3id.org/htan/
  linkml: https://w3id.org/linkml/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
default_prefix: htan

enums:
  LibraryLayoutEnum:
    permissible_values:
      "Paired-end":
        description: Paired-end sequencing
      "Single-end":
        description: Single-end sequencing

  SequencingPlatformEnum:
    permissible_values:
      "ABI_SOLID":
        description: ABI SOLID sequencing platform
      "BGISEQ":
        description: BGI sequencing platform
      "CAPILLARY":
        description: Capillary sequencing platform
      "COMPLETE_GENOMICS":
        description: Complete Genomics sequencing platform
      "HELICOS":
        description: Helicos sequencing platform
      "ILLUMINA":
        description: Illumina sequencing platform
      "ION_TORRENT":
        description: Ion Torrent sequencing platform
      "LS454":
        description: 454 sequencing platform
      "OXFORD_NANOPORE":
        description: Oxford Nanopore sequencing platform
      "PACBIO_SMRT":
        description: PacBio SMRT sequencing platform

  GenomicReferenceEnum:
    description: Genomic or transcriptomic reference assembly used for alignment
    permissible_values:
      "GRCh37":
        description: Genome Reference Consortium human build 37
      "GRCh37.p13":
        description: GRCh37 patch release 13
      "GRCh38":
        description: Genome Reference Consortium human build 38
      "GRCh38.p13":
        description: GRCh38 patch release 13
      "GRCh38.p14":
        description: GRCh38 patch release 14
      "hg19":
        description: UCSC human genome reference hg19
      "hg38":
        description: UCSC human genome reference hg38

  # ---------------------------------------------------------------------------
  # Shared single-cell / single-nucleus vocabularies (consumed by scRNA-seq,
  # scATAC-seq via SingleCellLevel1Attributes / AnnDataComplianceMixin below).
  # ---------------------------------------------------------------------------
  DissociationMethodEnum:
    permissible_values:
      "Enzymatic":
        description: Enzymatic dissociation method
      "Mechanical":
        description: Mechanical dissociation method
      "Other":
        description: Other dissociation method
      "Unknown":
        description: Unknown dissociation method

  LibraryConstructionMethodEnum:
    permissible_values:
      "10X Genomics":
        description: 10X Genomics library construction method
      "Drop-seq":
        description: Drop-seq library construction method
      "Fluidigm C1":
        description: Fluidigm C1 library construction method
      "InDrop":
        description: InDrop library construction method
      "Other":
        description: Other library construction method
      "Smart-seq":
        description: Smart-seq library construction method
      "Unknown":
        description: Unknown library construction method

  NucleicAcidSourceEnum:
    permissible_values:
      "DNA":
        description: DNA nucleic acid source
      "RNA":
        description: RNA nucleic acid source
      "Unknown":
        description: Unknown nucleic acid source

  SingleCellIsolationMethodEnum:
    permissible_values:
      "Cell Sorting":
        description: Cell sorting isolation method
      "Droplet-based":
        description: Droplet-based isolation method
      "Manual Picking":
        description: Manual picking isolation method
      "Microfluidics":
        description: Microfluidics isolation method
      "Other":
        description: Other isolation method
      "Unknown":
        description: Unknown isolation method

  # RNA-workflow vocabularies. Centralized here to avoid duplication across assays;
  # the corresponding slots are declared per-assay (not on SingleCellLevel1Attributes)
  # because reverse transcription and spike-ins are RNA-workflow concepts.
  ReverseTranscriptionPrimerEnum:
    permissible_values:
      "Oligo-dT":
        description: Oligo-dT reverse transcription primer
      "Random Hexamer":
        description: Random hexamer reverse transcription primer
      "Unknown":
        description: Unknown reverse transcription primer

  SpikeInEnum:
    permissible_values:
      "ERCC":
        description: ERCC spike-in
      "None":
        description: No spike-in
      "Other":
        description: Other spike-in
      "Unknown":
        description: Unknown spike-in

classes:
  BaseSequencingAttributes:
    is_a: CoreFileAttributes
    description: Minimal base attributes shared across all sequencing types
    attributes:
      CHECKSUM:
        range: string
        required: false
        title: "Checksum"
        description: Checksum for data integrity verification

  BaseSequencingLevel1Attributes:
    is_a: BaseSequencingAttributes
    description: Level 1 attributes - sequencing run and library (raw data)
    attributes:
      LIBRARY_LAYOUT:
        range: LibraryLayoutEnum
        required: true
        title: "Library Layout"
        description: Library layout (paired-end or single-end)
      SEQUENCING_PLATFORM:
        range: SequencingPlatformEnum
        required: true
        title: "Sequencing Platform"
        description: Sequencing platform used
      SEQUENCING_BATCH_ID:
        range: string
        required: false
        title: "Sequencing Batch ID"
        description: Sequencing batch identifier
      LIBRARY_PREPARATION_DAYS_FROM_INDEX:
        range: integer
        required: false
        title: "Library Preparation Days From Index"
        description: "Number of days between when the sample for assay was received in the lab and the libraries were prepared for sequencing. If not applicable please enter 'Not Applicable')"
      TECHNICAL_REPLICATE_GROUP:
        range: string
        required: false
        title: "Technical Replicate Group"
        description: Technical replicate group identifier
      PROTOCOL_LINK:
        range: string
        required: false
        title: "Protocol Link"
        description: Link to sequencing protocol

  BaseSequencingLevel2Attributes:
    is_a: BaseSequencingLevel1Attributes
    description: Level 2 attributes - alignment and alignment workflow
    attributes:
      GENOMIC_REFERENCE:
        range: GenomicReferenceEnum
        required: true
        title: "Genomic or Transcriptomic Reference"
        description: "Genomic or transcriptomic reference assembly used for alignment. If your genome reference is not among the valid values, please contact your data liaison."
      GENOMIC_REFERENCE_URL:
        range: string
        required: true
        title: "Genomic or Transcriptomic Reference URL"
        description: URL to genomic or transcriptomic reference
      GENOME_ANNOTATION_URL:
        range: string
        required: true
        title: "Genome or Transcriptome Annotation URL"
        description: URL to genome or transcriptome annotation
      WORKFLOW_VERSION:
        range: string
        required: true
        title: "Workflow Version"
        description: Major version of the workflow, or 'Not applicable' when no workflow version applies.
      WORKFLOW_LINK:
        range: string
        required: true
        title: "Workflow Link"
        description: Link to workflow or command. DockStore.org recommended

  BaseSequencingLevel3Attributes:
    is_a: BaseSequencingLevel2Attributes
    description: Level 3+ attributes - inherits alignment and workflow; used for processed/analysis levels

  # ---------------------------------------------------------------------------
  # Shared single-cell layer. Consumed by scRNA-seq and scATAC-seq so common
  # single-cell attributes are defined once rather than duplicated per assay.
  # ---------------------------------------------------------------------------
  SingleCellLevel1Attributes:
    is_a: BaseSequencingLevel1Attributes
    description: Shared upstream single-cell / single-nucleus preparation attributes for single-cell sequencing Level 1 (tissue-to-cell/nucleus steps common to scRNA-seq and scATAC-seq)
    attributes:
      SINGLE_CELL_ISOLATION_METHOD:
        range: SingleCellIsolationMethodEnum
        required: true
        title: "Single Cell Isolation Method"
        description: Method used to isolate single cells
      DISSOCIATION_METHOD:
        range: DissociationMethodEnum
        required: true
        title: "Dissociation Method"
        description: Method used to dissociate tissue into single cells
      CRYOPRESERVED_CELLS_IN_SAMPLE:
        range: boolean
        required: false
        title: "Cryopreserved Cells in Sample"
        description: Whether cells were cryopreserved in the sample
      NUCLEIC_ACID_SOURCE:
        range: NucleicAcidSourceEnum
        required: true
        title: "Nucleic Acid Source"
        description: Type of nucleic acid used for sequencing
      LIBRARY_CONSTRUCTION_METHOD:
        range: LibraryConstructionMethodEnum
        required: true
        title: "Library Construction Method"
        description: Method used to construct the sequencing library

  AnnDataComplianceMixin:
    mixin: true
    description: AnnData 0.1 / CellxGene compliance attributes for single-cell h5ad outputs, shared across single-cell modalities that emit h5ad matrices
    attributes:
      ANNDATA_SCHEMA_VERSION:
        range: string
        required: true
        title: "AnnData Schema Version"
        description: Version of AnnData schema (must be 0.1 for CellxGene compliance)
        pattern: "^0\\.1$"
      ANNDATA_STRUCTURE_VALIDATED:
        range: boolean
        required: true
        title: "AnnData Structure Validated"
        description: Whether the h5ad file structure has been validated against AnnData 0.1 schema
