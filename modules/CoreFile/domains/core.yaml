name: Core
id: https://w3id.org/htan/core
description: HTAN Core Data Model - Universal attributes shared across all file-based modules

# Related HTAN Identifiers (defined in other modules):
# - HTAN_PARTICIPANT_ID: modules/Clinical/domains/clinical.yaml
# - HTAN_BIOSPECIMEN_ID: modules/Biospecimen/domains/biospecimen.yaml
# - HTAN_PANEL_ID: modules/SpatialOmics/domains/spatial_panel.yaml
# For complete identifier documentation, see IDENTIFIER_PATTERNS.md in repository root

imports:
  - linkml:types

prefixes:
  htan: https://w3id.org/htan/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  NCIT: http://purl.obolibrary.org/obo/NCIT_

default_prefix: htan

classes:
  CoreFileAttributes:
    description: Universal attributes that apply to all file-based data in HTAN
    attributes:
      FILENAME:
        range: string
        required: true
        title: "File Name"
        description: Name of the file
      FILE_FORMAT:
        range: string
        required: true
        title: "File Format"
        description: Format of the file (e.g., fastq, bam, vcf, h5ad)
      HTAN_DATA_FILE_ID:
        range: string
        required: true
        identifier: true
        title: "HTAN Data File ID"
        description: HTAN Data File ID (Primary Key)
        pattern: "^(?=.{1,50}$)(HTA2[0-2][0-9])_(0000|EXT[0-9]{1,18}|[0-9]{1,21})_(D[0-9]{1,20})$"
      HTAN_PARENT_ID:
        range: string
        required: true
        title: "HTAN Parent ID"
        description: HTAN Parent ID - Foreign Key to parent entity (B for Biospecimen, D for data file). Must have B or D suffix. Supports HTA200-229 for phase 2.
        pattern: "^(?=.{1,50}$)(HTA2[0-2][0-9])_(0000|EXT[0-9]{1,18}|[0-9]{1,21})_([BD][0-9]{1,20})$"
