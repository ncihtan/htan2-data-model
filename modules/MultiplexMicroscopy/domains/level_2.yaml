name: MultiplexMicroscopyLevel2
id: https://w3id.org/htan/multiplex_microscopy/level_2
description: HTAN Multiplex Microscopy Level 2 - Imaging data with channel metadata

imports:
  - linkml:types
  - linkml:extensions
  - ../../Imaging/domains/imaging

prefixes:
  htan: https://w3id.org/htan/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/

default_prefix: htan

enums:
  ImagingAssayType:
    permissible_values:
      "CODEX":
        description: CODEX imaging assay type
      "CyCIF":
        description: Cyclic Immunofluorescence imaging assay type
      "ExSeq":
        description: Expansion Sequencing imaging assay type
      "GeoMX-DSP":
        description: GeoMX Digital Spatial Profiling imaging assay type
      "H&E":
        description: Hematoxylin and Eosin imaging assay type
      "IHC":
        description: Immunohistochemistry imaging assay type
      "IMC":
        description: Imaging Mass Cytometry imaging assay type
      "MIBI":
        description: Multiplexed Ion Beam Imaging imaging assay type
      "MERFISH":
        description: Multiplexed Error-Robust Fluorescence In Situ Hybridization imaging assay type
      "MxIF":
        description: Multiplexed Immunofluorescence imaging assay type
      "mIHC":
        description: Multiplexed Immunohistochemistry imaging assay type
      "Not Applicable":
        description: Imaging assay not applicable
      "SABER":
        description: Signal Amplification By Exchange Reaction imaging assay type
      "t-CyCIF":
        description: Tissue Cyclic Immunofluorescence imaging assay type

classes:
  MultiplexMicroscopyLevel2:
    is_a: BaseImagingAttributes
    description: Multiplex Microscopy Level 2 - Imaging data compiled into a single file format (preferably tiled and pyramidal OME-TIFF), accompanied by a CSV file containing channel metadata
    attributes:
      # File format restriction for Level 2 imaging data
      FILE_FORMAT:
        range: string
        required: true
        title: "File Format"
        description: Format of the imaging file. Must be compatible with Bio-Formats or OpenSlide Python. OME-TIFF files use extensions .ome.tif, .ome.tiff, .ome.tf2, .ome.tf8, or .ome.btf
        pattern: "^(ome-tiff|tiff|qptiff|svs)$"
      FILENAME:
        range: string
        required: true
        title: "File Name"
        description: Name of the file. Must end with an extension matching the FILE_FORMAT (.ome.tif, .ome.tiff, .ome.tf2, .ome.tf8, .ome.btf for ome-tiff; .tiff or .tif for tiff; .qptiff for qptiff; .svs for svs)
        pattern: "^.+\\.(ome\\.(tif|tiff|tf2|tf8|btf)|tiff?|qptiff|svs)$"
      
      # Multiplex Microscopy specific attributes
      WORKING_DISTANCE:
        range: string
        required: false
        title: "Working Distance"
        description: The working distance of the lens, expressed as a floating point number. Floating point > 0. Size needs to be specified in microns (um)

      IMAGING_ASSAY_TYPE:
        range: ImagingAssayType
        required: true
        title: "Imaging Assay Type"
        description: Type of imaging assay

      PYRAMID:
        range: boolean
        required: false
        title: "Pyramid"
        description: The data file contains an image pyramid

      PHYSICAL_SIZE_X:
        range: float
        required: true
        minimum_value: 0.0
        title: "Physical Size X"
        description: Physical size of a single pixel in the x dimension. In microns.

      PHYSICAL_SIZE_Y:
        range: float
        required: true
        minimum_value: 0.0
        title: "Physical Size Y"
        description: Physical size of a single pixel in the y dimension. In microns.

      PHYSICAL_SIZE_Z:
        range: float
        required: false
        minimum_value: 0.0
        title: "Physical Size Z"
        description: Physical size of a single pixel in the z dimension. In microns. Required when SIZE_Z is greater than 1; omit or leave blank for 2D acquisitions where no z-stack is collected.

      SIZE_C:
        range: integer
        required: true
        minimum_value: 1
        title: "Size C"
        description: Number of channels. Integer >= 1

      SIZE_T:
        range: integer
        required: true
        minimum_value: 1
        title: "Size T"
        description: Number of timepoints. Integer >= 1

      SIZE_X:
        range: integer
        required: true
        minimum_value: 1
        title: "Size X"
        description: The number of pixels in the x dimension at the highest resolution available

      SIZE_Y:
        range: integer
        required: true
        minimum_value: 1
        title: "Size Y"
        description: The number of pixels in the y dimension at the highest resolution available

      SIZE_Z:
        range: integer
        required: true
        minimum_value: 1
        title: "Size Z"
        description: The number of pixels in the z dimension at the highest resolution available

      HTAN_PANEL_ID:
        range: string
        required: true
        title: "HTAN Panel ID"
        description: Unique HTAN identifier for the antibody/reagent panel used to acquire this image. Must match the HTAN_PANEL_ID in the corresponding ChannelMetadata RecordSet. Follows the HTAN identifier format with a P-prefix segment (e.g., HTA201_1_P1).
        pattern: "^(?=.{1,50}$)(HTA2[0-2][0-9])_(0000|EXT[0-9]{1,18}|[0-9]{1,21})_(P[0-9]{1,20})$"

    rules:
      - preconditions:
          slot_conditions:
            SIZE_Z:
              minimum_value: 2
        postconditions:
          slot_conditions:
            PHYSICAL_SIZE_Z:
              required: true

