classes:
  ChannelMetadata:
    description: Metadata for each channel in multiplex microscopy imaging
    attributes:
      CHANNEL_ID:
        range: string
        required: true
        title: "Channel ID"
        description: The unique channel identifier for each channel in this image must match the corresponding field in the imaging file submitted

      CHANNEL_NAME:
        range: string
        required: true
        title: "Channel Name"
        description: Channel label for each channel in this image must match the corresponding field in the imaging file submitted

      CYCLE_NUMBER:
        range: integer
        required: false
        title: "Cycle Number"
        description: The cycle # in which the co-listed reagent(s) was(were) used

      SUB_CYCLE_NUMBER:
        range: integer
        required: false
        title: "Sub Cycle Number"
        description: Sub-cycle #

      TARGET_NAME:
        range: string
        required: false
        title: "Target Name"
        description: Short descriptive name (abbreviation) for this target (antigen)

      ANTIBODY_NAME:
        range: string
        required: false
        title: "Antibody Name"
        description: Short descriptive name for this antibody

      RRID_IDENTIFIER:
        range: string
        required: false
        title: "RRID Identifier"
        description: Research Resource Identifier
        pattern: "^RRID:AB_\\d+$"

      FLUOROPHORE:
        range: string
        required: false
        title: "Fluorophore"
        description: Fluorescent dye label

      CLONE:
        range: string
        required: false
        title: "Clone"
        description: Unique clone identifier

      LOT:
        range: string
        required: false
        title: "Lot"
        description: Lot number from vendor

      CATALOG_NUMBER:
        range: string
        required: false
        title: "Catalog Number"
        description: Catalog number from vendor

      EXCITATION_WAVELENGTH:
        range: float
        required: false
        title: "Excitation Wavelength"
        description: Center/peak of the excitation spectrum (nm)

      EMISSION_WAVELENGTH:
        range: float
        required: false
        title: "Emission Wavelength"
        description: Center/peak of the emission spectrum (nm)

      EXCITATION_BANDWIDTH:
        range: float
        required: false
        title: "Excitation Bandwidth"
        description: Nominal width of excitation spectrum (nm)

      EMISSION_BANDWIDTH:
        range: float
        required: false
        title: "Emission Bandwidth"
        description: Nominal width of emission spectrum (nm)

      METAL_ISOTOPE_ELEMENT_ABBREVIATION:
        range: MetalIsotopeElement
        required: false
        title: "Metal Isotope Element Abbreviation"
        description: Element abbreviation

      METAL_ISOTOPE_ELEMENT_MASS:
        range: integer
        required: false
        title: "Metal Isotope Element Mass"
        description: Element mass number

      OLIGO_BARCODE_UPPER_STRAND:
        range: string
        required: false
        title: "Oligo Barcode Upper Strand"
        description: DNA barcode used for labeling

      OLIGO_BARCODE_LOWER_STRAND:
        range: string
        required: false
        title: "Oligo Barcode Lower Strand"
        description: DNA barcode used for labeling

      DILUTION:
        range: string
        required: false
        title: "Dilution"
        description: Final dilution ratio used in experiment

      CONCENTRATION:
        range: string
        required: false
        title: "Concentration"
        description: Final concentration used in experiment

