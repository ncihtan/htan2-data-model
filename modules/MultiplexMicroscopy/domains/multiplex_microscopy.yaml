name: MultiplexMicroscopy
id: https://w3id.org/htan/multiplex_microscopy
description: HTAN Multiplex Microscopy Data Model Schema for Phase 2 - All Levels

imports:
  - linkml:types
  - linkml:extensions
  - ../../CoreFile/domains/core
  - level_2
  - level_3
  - level_4
  - multiplex_microscopy_channel_metadata

prefixes:
  htan: https://w3id.org/htan/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/

default_prefix: htan

slots:
  caDSR_id:
    description: The caDSR identifier for this element
    range: string
    multivalued: false
    required: false

classes:
  MultiplexMicroscopyData:
    description: Container for all Multiplex Microscopy data levels
    attributes:
      LEVEL_2_DATA:
        range: MultiplexMicroscopyLevel2
        required: false
        description: Level 2 Multiplex Microscopy data (imaging data with channel metadata)
      LEVEL_3_DATA:
        range: MultiplexMicroscopyLevel3
        required: false
        description: Level 3 Multiplex Microscopy data (segmentation masks)
      LEVEL_4_DATA:
        range: MultiplexMicroscopyLevel4
        required: false
        description: Level 4 Multiplex Microscopy data (cell-by-feature tables)
      CHANNEL_METADATA:
        range: ChannelMetadata
        multivalued: true
        inlined_as_list: true
        required: false
        description: Channel metadata records for multiplex microscopy imaging

