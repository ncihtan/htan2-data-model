name: scRNALevel1
id: https://w3id.org/htan/scrna_seq_level1
description: HTAN scRNA-seq Level 1 Data Model - Raw sequencing files and metadata
imports:
  - linkml:types
  - ../../Sequencing/domains/sequencing
prefixes:
  htan: https://w3id.org/htan/
  linkml: https://w3id.org/linkml/
  NCIT: http://purl.obolibrary.org/obo/NCIT_
default_prefix: htan

enums:
  # scRNA-seq-specific enum (shared single-cell prep and RNA-workflow enums are
  # imported from the Sequencing base).
  ReadIndicatorEnum:
    permissible_values:
      "Forward":
        description: Forward read indicator
      "Index":
        description: Index read indicator
      "Reverse":
        description: Reverse read indicator
      "Unknown":
        description: Unknown read indicator

classes:
  scRNALevel1:
    is_a: SingleCellLevel1Attributes
    description: scRNA-seq Level 1 data - Raw sequencing files and metadata
    attributes:
      # File format restriction for Level 1 raw sequencing files
      FILE_FORMAT:
        range: string
        required: true
        title: "File Format"
        description: Format of the raw sequencing file (fastq or fastq.gz)
        pattern: "^(fastq|fastq\\.gz)$"
      FILENAME:
        range: string
        required: true
        title: "File Name"
        description: Name of the file. Must end with an extension matching the FILE_FORMAT (.fastq for fastq; .fastq.gz or .fq.gz for fastq.gz)
        pattern: "^.+\\.(fastq|fq)(\\.gz)?$"
      # RNA-workflow attributes (enums shared via the Sequencing base)
      REVERSE_TRANSCRIPTION_PRIMER:
        range: ReverseTranscriptionPrimerEnum
        required: true
        title: "Reverse Transcription Primer"
        description: Primer used for reverse transcription
      SPIKE_IN:
        range: SpikeInEnum
        required: true
        title: "Spike-in"
        description: Type of spike-in used, if any
      READ_INDICATOR:
        range: ReadIndicatorEnum
        required: true
        title: "Read Indicator"
        description: Type of read (forward, reverse, index)
